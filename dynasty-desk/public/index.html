<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dynasty Desk">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest?v=33">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=33">
<link rel="icon" type="image/png" href="/icon-192.png?v=33">
<meta name="theme-color" content="#0A0B0D">
<meta name="color-scheme" content="dark">
<title>Dynasty Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Anton&display=swap">
<style>
/* Dynasty Desk v37 — Sunday broadcast.
   Anton for scores and headlines, Barlow for everything else. Always dark: the app is a scorebug, not a document.
   Lime is yours (and "do this"), coral is the opponent, red is live, orange needs a look. Position colors stay on
   position labels only. Numbers that are points are big Anton; dynasty values live in the small ◆ pill. */
:root{
  --turf:#0A0B0D; --surface:#14151A; --raised:#1C1E24; --sunk:#101114; --line:#282A31; --line2:#33363F;
  --ink:#F1F2F0; --muted:#A0A2AB; --faint:#6A6C76;
  --sig:#C6F432; --on-sig:#0E0F11; --opp:#FF8A6B; --live:#FF453A; --warn:#F2A14D; --bad:#FF6B5E;
  --qb:#EC5C8C; --rb:#1DB5A3; --wr:#4F8CF7; --te:#F29530;
  --disp:"Anton",Impact,"Arial Narrow",sans-serif; --text:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--turf);-webkit-text-size-adjust:100%;font-synthesis-weight:none}
body{margin:0;background:var(--turf);color:var(--ink);font:400 15px/1.4 var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(0deg,transparent 0 59px,rgb(255 255 255 / .022) 59px 60px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
img{-webkit-touch-callout:none;-webkit-user-drag:none}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.n,.num{font-family:var(--disp);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.005em}
.me{color:var(--sig)}.op{color:var(--opp)}.mu{color:var(--muted)}.fa{color:var(--faint)}
.up{color:var(--sig)}.dn{color:var(--bad)}
.wrap{max-width:620px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
body.has-bar .wrap{padding-bottom:calc(178px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:12px}
#view.wkload{opacity:.5;pointer-events:none;transition:opacity .2s}

/* ---- Top: crown mark + league scorebugs ---- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;margin:0 -14px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;background:rgb(10 11 13 / .88);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.mark{width:38px;height:38px;border-radius:11px;flex:none;display:block;background:#000}
.lgs{display:flex;gap:6px;flex:1;min-width:0}
.lgs:empty{display:none}
.lg{position:relative;flex:1 1 0;min-width:0;border:0;border-radius:11px;background:var(--surface);padding:6px 9px 7px;box-shadow:inset 0 0 0 1px var(--line);text-align:left;cursor:pointer;color:inherit;transition:box-shadow .2s,background .2s}
.lg .nm{display:flex;align-items:center;gap:4px;font:600 10.5px/1.1 var(--text);color:var(--muted);white-space:nowrap;overflow:hidden}
.lg .nm span{overflow:hidden;text-overflow:ellipsis}
.lg .sc{display:flex;gap:4px;align-items:baseline;margin-top:4px;font:400 16px/1 var(--disp);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lg .sc b{font-weight:400;color:var(--ink)}.lg .sc em{font-style:normal;font-size:12px;color:var(--faint)}
.lg .w{width:6px;height:6px;border-radius:2px;flex:none;background:var(--faint)}
.lg .w.up{background:var(--sig)}.lg .w.dn{background:var(--opp)}
.lg .w.live{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.lg[aria-selected="true"]{background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--sig)}
.lg[aria-selected="true"] .nm{color:var(--ink)}
.lg .fix{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.lg.all{flex:0 0 46px;display:grid;place-items:center;padding:0;font:400 13px/1 var(--disp);color:var(--muted);letter-spacing:.03em}
.lg.all[aria-selected="true"]{color:var(--ink)}
.lg:active{transform:scale(.97)}
.sub{margin:0;text-align:center;font-size:12px;color:var(--faint)}
.foot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--faint);text-align:center}
.foot .warn{color:var(--warn)}

/* ---- Shared pieces ---- */
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block;flex:none;box-shadow:0 0 0 3px rgb(255 69 58 / .22);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgb(255 69 58 / .5)}80%,100%{box-shadow:0 0 0 6px transparent}}
.dot.sm{width:6px;height:6px;box-shadow:none;animation:none}
.panel{border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:6px 12px 8px;display:flex;flex-direction:column}
.panel.pad{padding:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 2px 6px;font:400 15px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase}
.ph small{font:500 11.5px/1.2 var(--text);color:var(--muted);text-transform:none;letter-spacing:0;text-align:right;min-width:0}
.ph{white-space:nowrap}.ph small{white-space:normal}
.h1{margin:2px 0 0;font:400 30px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.h1 small{font:500 12px/1.2 var(--text);color:var(--muted);text-transform:none;letter-spacing:0}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.note.empty{padding:14px 4px;text-align:center}
.hr{height:1px;background:var(--line);margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 12px;font:600 13px/1 var(--text);white-space:nowrap;cursor:pointer;background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);transition:transform .12s var(--ease),opacity .2s;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--sig);color:var(--on-sig);box-shadow:none}
.btn.warn{background:var(--warn);color:#1a1205;box-shadow:none}
.btn.danger{background:var(--bad);color:#1a0705;box-shadow:none}
.btn.big{padding:13px 16px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.pri:disabled{opacity:1;background:rgb(198 244 50 / .2);color:var(--sig)}
.btn.sm{padding:7px 10px;font-size:12px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;font:600 12px/1 var(--text);padding:9px 11px;border-radius:10px;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;cursor:pointer;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0c0d10;box-shadow:none}
.seg button:active{transform:scale(.96)}
.slot{width:34px;height:24px;border-radius:7px;display:grid;place-items:center;font:400 12px/1 var(--disp);color:#0c0d10;letter-spacing:.04em;flex:none}
.slot.QB{background:var(--qb)}.slot.RB{background:var(--rb)}.slot.WR{background:var(--wr)}.slot.TE{background:var(--te)}
.slot.FLX,.slot.SF{background:none;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line2)}
.slot.BN{background:none;color:var(--faint);box-shadow:inset 0 0 0 1.5px var(--line)}
.pos{display:inline-grid;place-items:center;height:15px;padding:0 4px;border-radius:4px;font:400 10px/1 var(--disp);color:#0c0d10;letter-spacing:.04em;flex:none;background:#3a3d47}
.pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}.pos.TE{background:var(--te)}.pos.PK{background:#3a3d47;color:var(--ink)}
.tag{font:700 10px/1 var(--text);padding:3px 5px;border-radius:5px;background:var(--raised);color:var(--muted);flex:none}
.tag.q{background:#3a2c12;color:var(--warn)}.tag.o{background:#3d1a16;color:var(--bad)}.tag.r{background:#22252c;color:var(--ink)}
.dr{font:600 10.5px/1 var(--text);padding:3px 5px;border-radius:5px;white-space:nowrap;flex:none}
.dr.easy{background:rgb(198 244 50 / .13);color:var(--sig)}.dr.hard{background:rgb(255 107 94 / .14);color:var(--bad)}.dr.mid{background:var(--raised);color:var(--muted)}
.swapin{font:600 10.5px/1 var(--text);padding:4px 6px;border-radius:6px;background:rgb(198 244 50 / .13);color:var(--sig);white-space:nowrap;flex:none}
.vchip{display:inline-flex;align-items:center;gap:3px;font:600 10.5px/1 var(--text);padding:3px 6px;border-radius:20px;background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.vchip::before{content:"◆";font-size:7px;color:var(--faint)}
.vchip b{font:inherit}
.vchip .vt{font-style:normal;font-size:8px}
.vt.up{color:var(--sig)}.vt.dn{color:var(--bad)}.vt.flat{color:var(--faint)}
.vchip.none{color:var(--faint)}.vchip.none::before{display:none}
.vchip.lg{font-size:12.5px;padding:4px 8px}
.plate{--sz:30px;width:var(--sz);height:var(--sz);border-radius:9px;display:grid;place-items:center;font:400 13px/1 var(--disp);background:var(--sunk);box-shadow:inset 0 0 0 2px var(--sig);flex:none;position:relative;overflow:hidden;color:var(--ink);letter-spacing:.02em}
.plate img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:6px;object-fit:cover}
.plate.o{box-shadow:inset 0 0 0 2px var(--opp)}
.plate.s{--sz:24px;border-radius:7px;font-size:11px;box-shadow:inset 0 0 0 1.5px var(--line2)}
.plate.s.mine{box-shadow:inset 0 0 0 1.5px var(--sig)}
.plate.s img{inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);border-radius:5px}

/* Player photo with team logo badge */
.hs{position:relative;width:38px;height:38px;flex:none}
.hsi{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,#2A2D35,#1A1C21);box-shadow:inset 0 0 0 1.5px rgb(255 255 255 / .1);font:400 13px/1 var(--disp);color:var(--faint)}
.hsi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;background:#22252B}
.hsb{position:absolute;right:-5px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.hs.lg2{width:64px;height:64px}.hs.lg2 .hsb{width:24px;height:24px;right:-3px;bottom:-1px}.hs.lg2 .hsi{font-size:20px}
.tl{--tc:#555;position:relative;display:inline-grid;place-items:center;width:var(--sz,18px);height:var(--sz,18px);border-radius:50%;background:var(--tc);color:#fff;font:700 calc(var(--sz,18px) * .34)/1 var(--text);flex:none;overflow:hidden;vertical-align:middle}
.tl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:9%;opacity:0;transition:opacity .25s}
.tl.ok{background:transparent}.tl.ok img{opacity:1;padding:0}.tl.ok b{visibility:hidden}
.tl b{font:inherit}

/* ---- Scorebug ---- */
.board{border-radius:22px;background:linear-gradient(180deg,#1B1D23,#131419);box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px 14px;position:relative;overflow:hidden}
.btop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);min-height:26px}
.bst{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);white-space:nowrap;min-width:0}
.bst .mu{font-weight:500}
.rf{width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;position:relative;margin-right:-6px}
.rf::before{content:"";position:absolute;inset:-9px}
.rf svg{width:14px;height:14px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sides{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;margin-top:12px;gap:6px}
.sides[data-act]{cursor:pointer}
.side{min-width:0}
.side .who{display:flex;align-items:center;gap:8px;min-width:0}
.side.r{text-align:right}.side.r .who{flex-direction:row-reverse}
.tn{font:600 13px/1.15 var(--text);min-width:0}
.tn span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn small{display:block;font:500 11px/1.2 var(--text);color:var(--muted);margin-top:2px;white-space:nowrap}
.big{display:block;font:400 46px/.95 var(--disp);margin-top:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vsx{font:400 12px/1 var(--disp);color:var(--faint);padding-bottom:12px;letter-spacing:.06em}
.ssub{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.side.r .ssub{justify-content:flex-end}
.pips{display:inline-flex;gap:3px;flex-wrap:nowrap}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.pips i.d{background:var(--muted)}.pips i.l{background:var(--live)}.pips i.u{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.drive{margin-top:13px}
.drive .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:400 15px/1 var(--disp);margin-bottom:6px;letter-spacing:.01em}
.drive .lbl span{font:500 11.5px/1.2 var(--text);color:var(--muted);text-align:center;min-width:0}
.field{height:26px;border-radius:7px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#22252c 0 10%,#1d2026 10% 20%);box-shadow:inset 0 0 0 1px var(--line2)}
.field .ez{position:absolute;top:0;bottom:0;width:7%;display:grid;place-items:center;font:400 9px/1 var(--disp);letter-spacing:.06em;overflow:hidden}
.field .ez.a{left:0;background:rgb(198 244 50 / .2);color:var(--sig)}.field .ez.b{right:0;background:rgb(255 138 107 / .2);color:var(--opp)}
.field .yd{position:absolute;left:7%;right:7%;top:0;bottom:0;display:flex;justify-content:space-around;align-items:center;font:400 9px/1 var(--disp);color:#5a5d68;letter-spacing:.04em}
.field .gain{position:absolute;left:7%;bottom:0;height:5px;background:var(--sig);transition:width .8s var(--ease)}
.field .ball{position:absolute;top:50%;width:19px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%) rotate(-18deg);box-shadow:0 0 0 2.5px #111317;transition:left .8s var(--ease)}
.field .ball::after{content:"";position:absolute;left:5px;right:5px;top:5px;height:2px;background:#111317;border-radius:1px}
.board.intro .gain{animation:gain 1.1s var(--ease) .15s both}
.board.intro .ball{animation:ball 1.1s var(--ease) .15s both}
@keyframes gain{from{width:43%}}
@keyframes ball{from{left:50%}}
.bnote{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.recap{margin-top:12px;width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:12px;padding:11px 12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);font:600 13px/1 var(--text);cursor:pointer}
.recap b{color:var(--sig);font-weight:600}
/* Week stepper (inside the scorebug) */
.wks{display:inline-flex;align-items:center;gap:0;background:var(--sunk);border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);height:26px;flex:none}
.wks button{position:relative;border:0;background:none;color:var(--ink);height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:9px}
.wks button::before{content:"";position:absolute;top:-10px;bottom:-10px;left:-2px;right:-2px}
.wks .wk-arrow{width:24px;color:var(--muted)}
.wks .wk-arrow svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wks .wk-arrow:disabled{opacity:.3;cursor:default}
.wks .wk-label{gap:4px;padding:0 2px;font:600 12.5px/1 var(--text);white-space:nowrap}
.wks .wk-label svg{width:8px;height:8px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wk-back{position:relative;border:0;background:none;color:var(--sig);font:600 12.5px/1 var(--text);padding:0;cursor:pointer;white-space:nowrap;text-decoration:underline;text-decoration-color:rgb(198 244 50 / .35);text-underline-offset:3px}
.wk-back::before{content:"";position:absolute;inset:-12px -4px}
.wkrow{display:none}
.wkpop{position:fixed;inset:0;z-index:85;background:rgb(0 0 0 / .45)}
.wkpop-card{position:absolute;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--raised);border-radius:20px;padding:14px 14px 16px;box-shadow:0 30px 60px -20px #000,inset 0 0 0 1px var(--line2);animation:open .2s var(--ease)}
.wkpop-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 12px;font-size:12.5px;color:var(--muted)}
.wkpop-head b{font:400 16px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.wkpop-now{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.wkpop-now i,.wkc i{width:6px;height:6px;border-radius:50%;background:var(--sig);display:inline-block}
.wkgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wkc{position:relative;min-height:44px;border:0;border-radius:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);cursor:pointer;font:400 17px/1 var(--disp)}
.wkc.past{color:var(--muted)}
.wkc.on{background:var(--sig);color:var(--on-sig);box-shadow:none}
.wkc i{position:absolute;top:6px;right:6px}
.wkpop-foot{display:flex;justify-content:space-between;gap:10px;margin:12px 2px 0;font-size:12px;color:var(--muted)}
@keyframes open{from{opacity:0;transform:translateY(8px)}}

/* ---- Fix card ---- */
.fix{display:flex;gap:10px;align-items:center;background:#2A2114;box-shadow:inset 0 0 0 1px #5a431d;border-radius:14px;padding:9px 10px 9px 12px;font-size:12.5px;line-height:1.35}
.fix b{color:var(--warn);font-weight:600}.fix .t{flex:1;min-width:0}
.fix.calm{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.fix.calm b{color:var(--ink)}

/* ---- Lineup rows ---- */
.row{position:relative;display:grid;grid-template-columns:34px 38px minmax(0,1fr) auto;gap:9px;align-items:center;width:100%;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.list>.row:first-child{border-top:0}
.row>.mid{min-width:0}
.row:active{background:rgb(255 255 255 / .03)}
.row.static{cursor:default}
.row.sh{grid-template-columns:38px minmax(0,1fr) auto}
.seg.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.pn{display:flex;align-items:center;gap:6px;font:600 14.5px/1.15 var(--text);white-space:nowrap;min-width:0}
.pn .nmx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;min-width:0;overflow:hidden}
.pm .ov{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pv{text-align:right;min-width:74px}
.pts{font:400 21px/1 var(--disp);font-variant-numeric:tabular-nums;border-radius:4px;display:inline-block}
.pts.proj{color:var(--muted)}.pts.zero{color:var(--faint)}
.rs{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.rs.on{color:var(--ink);font-weight:600}
.pace{display:block;height:3px;border-radius:2px;background:var(--line);margin:5px 0 0 auto;position:relative;width:74px}
.pace i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#8a8d98}
.pace i.hot{background:var(--sig)}
.pace u{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.row.live::before,.row.flag::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--live)}
.row.flag::before{background:var(--warn)}
.row.locked{cursor:default}
.row.flash{animation:flash 1.1s var(--ease)}
@keyframes flash{0%{background:rgb(198 244 50 / .16)}100%{background:transparent}}
.bump{animation:bump 1.4s var(--ease)}
@keyframes bump{0%{background:rgb(198 244 50 / .5);box-shadow:0 0 0 4px rgb(198 244 50 / .5);transform:scale(1.1)}100%{background:transparent;box-shadow:0 0 0 4px transparent;transform:none}}
.ro{font-size:12.5px;color:var(--muted);margin:0;padding:0 4px}

/* ---- Action bar and tab bar ---- */
.abar{position:fixed;left:12px;right:12px;bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:35;max-width:596px;margin:0 auto;border-radius:18px;background:rgb(28 30 36 / .97);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px var(--line2),0 16px 30px -12px #000;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px}
.abar .t{flex:1;min-width:0}
.abar .k{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar .v{font:400 24px/1 var(--disp);margin-top:3px;display:flex;align-items:baseline;gap:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.abar .v small{font:600 11.5px/1 var(--text);color:var(--sig);overflow:hidden;text-overflow:ellipsis}
.abar .v small.warn{color:var(--warn)}.abar .v small.bad{color:var(--bad)}
.abar .bs{display:flex;gap:8px;flex:none}
.abar .q{font:600 15px/1.2 var(--text)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(84px + env(safe-area-inset-bottom,0px) - 20px);min-height:64px;background:#0D0E11;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px env(safe-area-inset-bottom,0px)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:2px 0;font:600 10.5px/1 var(--text);color:var(--faint);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s var(--ease)}
.tabbar button:active svg{transform:scale(.86)}
.tabbar button[aria-current="page"]{color:var(--sig)}
.tabbar button[aria-current="page"] span{color:var(--ink)}
.tabbar b{position:absolute;top:-2px;left:calc(50% + 5px);min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--warn);color:#1a1205;font:700 10px/15px var(--text);text-align:center}
body.muopen .tabbar{z-index:62}
body.typing .tabbar,body.typing .abar{display:none}

/* ---- Game day hub ---- */
.hero{padding:2px 2px 0}
.hero .k{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.hero h2{margin:0;font:400 34px/1 var(--disp);text-transform:uppercase;letter-spacing:.005em}
.hero p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.mini{width:100%;border:0;color:inherit;text-align:left;cursor:pointer;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.mini:active{transform:scale(.99)}
.mini .lgn{font:600 11.5px/1 var(--text);color:var(--muted);display:flex;gap:7px;align-items:center;white-space:nowrap}
.mini .stt{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.mini .tm2{display:flex;align-items:center;gap:8px;font:600 13.5px/1 var(--text);margin-top:5px;min-width:0}
.mini .tm2 .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mini .tm2 .n{margin-left:auto;font-size:22px;padding-left:8px}
.mini .tm2.o{color:var(--muted)}.mini .tm2.o .n{color:var(--opp)}
.mini .tm2 .n.mu{color:var(--muted)}
.mini .wp{grid-row:2/4;grid-column:2;text-align:right;padding-left:12px;border-left:1px solid var(--line);align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-width:76px}
.mini .wp b{font:400 26px/1 var(--disp);font-weight:400}.mini .wp span{font-size:10.5px;color:var(--muted);margin-top:3px}
.mini .thin{grid-column:1/3;height:5px;border-radius:3px;display:flex;gap:2px;margin-top:6px}
.mini .thin i{background:var(--sig);border-radius:3px}.mini .thin u{background:var(--opp);border-radius:3px;opacity:.75}
.slate{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(62px,1fr);gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.slate::-webkit-scrollbar{display:none}
.slate>div{border-radius:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);padding:8px 4px 7px;text-align:center}
.slate .d{font:600 10px/1 var(--text);color:var(--muted);white-space:nowrap}.slate .c{font:400 20px/1 var(--disp);margin-top:5px}.slate .s{font-size:9.5px;color:var(--faint);margin-top:3px;white-space:nowrap}
.slate .done{opacity:.55}
.slate .now{background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--live)}.slate .now .s{color:var(--ink);font-weight:600}
.gm{padding:9px 0;border-top:1px solid var(--line)}.gm:first-of-type{border-top:0}
.gm .gh{display:flex;justify-content:space-between;align-items:center;font:600 12.5px/1 var(--text)}
.gm .gh span{color:var(--muted);font-weight:500;font-size:11.5px;display:flex;align-items:center;gap:5px}
.pl{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pl span{font:600 11.5px/1 var(--text);padding:5px 7px;border-radius:7px;display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.pl span b{font:400 13px/1 var(--disp)}.pl span em{font-style:normal;font-weight:500;font-size:10px;opacity:.7}
.pl .f{background:rgb(198 244 50 / .11);color:var(--sig);box-shadow:inset 0 0 0 1px rgb(198 244 50 / .3)}
.pl .a{background:rgb(255 138 107 / .1);color:var(--opp);box-shadow:inset 0 0 0 1px rgb(255 138 107 / .3)}
.lgd{display:inline-flex;gap:12px;font:500 11px/1 var(--text);color:var(--muted);align-items:center;text-transform:none;letter-spacing:0}
.lgd i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.todo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.3}
.todo:first-of-type{border-top:0}
.todo small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.todo b{font-weight:600}

/* ---- Full-screen overlays (matchup, week recap) ---- */
.mv{position:fixed;inset:0;z-index:60;background:var(--turf);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(100px + env(safe-area-inset-bottom,0px));animation:mvIn .32s var(--ease)}
.mv.out{animation:mvOut .22s var(--ease) forwards}
@keyframes mvIn{from{transform:translateY(24px);opacity:0}}
@keyframes mvOut{to{transform:translateY(24px);opacity:0}}
.mv-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ib2{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ib2 svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mh .tt{font:400 17px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em;text-align:center;min-width:0}
.mh .tt small{display:block;font:500 11px/1 var(--text);color:var(--muted);text-transform:none;letter-spacing:0;margin-top:4px}
.flow svg{width:100%;display:block;margin-top:2px}
.flow .fe{font-size:12px;color:var(--muted);padding:2px 2px 10px}
.edge{display:grid;grid-template-columns:44px 1fr 1fr 48px;align-items:center;padding:6px 0}
.edge .l,.edge .r{height:12px;position:relative}
.edge .l{border-right:1px solid var(--line2)}
.edge .l i{position:absolute;right:0;top:0;bottom:0;background:var(--sig);border-radius:3px 0 0 3px}
.edge .r i{position:absolute;left:0;top:0;bottom:0;background:var(--opp);border-radius:0 3px 3px 0}
.edge .v{font:400 14px/1 var(--disp);text-align:right}
.xr{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.xr:first-of-type{border-top:0}
.xr .a,.xr .b{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0;cursor:pointer}
.xr .b{flex-direction:row-reverse;text-align:right}
.xr .nm{font:600 12.5px/1.15 var(--text);min-width:0}
.xr .nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr .nm small{display:block;font:500 10.5px/1.2 var(--text);color:var(--muted);margin-top:2px;white-space:nowrap}
.xr .nm small.on{color:var(--ink)}
.xr .p{font:400 19px/1 var(--disp);flex:none;font-variant-numeric:tabular-nums}
.xr .a .p.w{color:var(--sig)}.xr .b .p.w{color:var(--opp)}.xr .p.z{color:var(--muted)}
.xr.bn{opacity:.75}
.morebtn{border:0;background:none;width:100%;text-align:center;padding:10px 0 6px;font:600 12px/1 var(--text);color:var(--muted);cursor:pointer}
.lbrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.lbrow:first-of-type{border-top:0}
.lbrow.mine{background:linear-gradient(90deg,rgb(198 244 50 / .08),transparent 70%);margin:0 -12px;padding:8px 12px}
.lbt{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600}
.lbt.r{flex-direction:row-reverse;text-align:right}
.lbt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbs{display:flex;align-items:center;gap:6px;font:400 15px/1 var(--disp);font-variant-numeric:tabular-nums;color:var(--muted)}
.lbs b{font-weight:400}.lbs b.w{color:var(--ink)}
.lbs i{font:500 10px/1.1 var(--text);font-style:normal;color:var(--faint);text-align:center}

/* ---- Player card ---- */
.isheet{position:fixed;inset:0;z-index:80;background:rgb(0 0 0 / .62);display:flex;align-items:flex-end;justify-content:center}
.isheet-card{width:100%;max-width:560px;background:#16171C;color:var(--ink);border-radius:28px 28px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -1px 0 var(--line2),0 -30px 60px #000;animation:sheetIn .3s var(--ease);touch-action:none}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.isheet-card h3{margin:0;font:400 22px/1 var(--disp);text-transform:uppercase}
.isheet-card p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.isheet-card p b{color:var(--ink)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 2px;flex:none}
.pcard .isheet-card{max-height:calc(100vh - 86px - env(safe-area-inset-top,0px));overflow-y:auto;touch-action:pan-y}
.pc{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center}
.pc h3{font-size:27px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc p{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pc .val{text-align:right}.pc .val b{font:400 22px/1 var(--disp);display:block;white-space:nowrap}.pc .val b i{font-style:normal;font-size:10px;color:var(--faint);vertical-align:3px}
.pc .val span{font-size:11px;font-weight:600;white-space:nowrap}
.chipl{display:flex;gap:6px;flex-wrap:wrap}
.chipl span{font:600 11.5px/1 var(--text);padding:6px 8px;border-radius:8px;background:var(--raised);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.chipl span b{color:var(--ink);font-weight:600}
.blk{border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:11px 12px}
.blk .bt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 12.5px/1 var(--text);margin-bottom:9px}
.blk .bt span{font-weight:500;font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.pinj{margin:0;padding:9px 12px;border-radius:12px;background:#2A2114;box-shadow:inset 0 0 0 1px #5a431d;color:var(--warn);font-size:13px}
.pinj.out{background:#2b1512;box-shadow:inset 0 0 0 1px #5d2620;color:var(--bad)}
.log{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:6px;align-items:end;height:96px}
.log .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;position:relative;min-width:0}
.log .c b{font:400 12px/1 var(--disp);font-weight:400;white-space:nowrap}
.log .c i{width:100%;border-radius:4px 4px 0 0;background:#3a3d47;position:relative}
.log .c i.hit{background:var(--sig)}
.log .c i.now{background:repeating-linear-gradient(135deg,var(--live) 0 4px,#b93229 4px 8px)}
.log .c i u{position:absolute;left:-2px;right:-2px;height:2px;background:var(--ink)}
.log .c span{font-size:10px;color:var(--muted);white-space:nowrap}
.rng{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;font:600 12px/1 var(--text);padding:5px 0}
.rng>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rng .tr{height:10px;border-radius:5px;background:var(--sunk);position:relative}
.rng .tr i{position:absolute;top:0;bottom:0;border-radius:5px;background:#3a3d47}
.rng .tr u{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.rng.best .tr i{background:rgb(198 244 50 / .45)}.rng.best .tr u{background:var(--sig)}
.rng b{font:400 15px/1 var(--disp);font-weight:400;text-align:right}
.spark{display:flex;align-items:center;gap:12px}
.spark svg{flex:1;height:40px;min-width:0}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.acts .btn{padding:13px 6px}
.sk{border-radius:16px;background:linear-gradient(100deg,var(--surface) 35%,var(--raised) 50%,var(--surface) 65%) 0 0/300% 100%;animation:shimmer 1.5s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-50% 0}}

/* ---- Waivers ---- */
.tiles{display:grid;gap:8px;grid-template-columns:1.25fr 1fr 1fr}
.tile{border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px;min-width:0}
.tile .k{font-size:11px;color:var(--muted)}
.tile .v{font:400 24px/1 var(--disp);margin-top:5px;white-space:nowrap}
.tile .v small{font:500 11.5px/1 var(--text);color:var(--muted);margin-left:3px}
.tile .s{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.3}
.tile .s.warn{color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--sig)}
.bar.g i{background:var(--muted)}
.search{display:flex;align-items:center;gap:9px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:0 12px;color:var(--faint)}
.search svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:400 16px/1 var(--text);padding:11px 0;outline:none}
.search input::placeholder{color:var(--faint)}
.fa2{padding:10px 0;border-top:1px solid var(--line)}
.fa2:first-of-type{border-top:0}
.fa2 .r1{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer}
.fa2 .r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:7px 8px 7px 10px;border-radius:10px;background:var(--sunk);font-size:11.5px;color:var(--muted);line-height:1.35}
.fa2 .r2 b{color:var(--ink);font-weight:600}
.fit{font:600 11px/1.25 var(--text);color:var(--sig);margin-top:5px}
.fit.mu{color:var(--muted)}
.paid{display:grid;grid-template-columns:110px 1fr 38px;gap:8px;align-items:center;font-size:12px;padding:4px 0}
.paid b{font:400 14px/1 var(--disp);font-weight:400;text-align:right}
.paid>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.claim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.claim:first-of-type{border-top:0}
.claim .ct b{display:block;font-weight:600;font-size:13.5px}
.claim .ct small{color:var(--muted);font-size:11.5px}
.claim .cr{display:flex;align-items:center;gap:6px}
.amt{font:400 20px/1 var(--disp);margin-right:4px}
.form{margin:6px 0 10px;padding:12px;border-radius:14px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;animation:open .25s var(--ease)}
.form .q{font-weight:600;font-size:14px;line-height:1.35}
.fgrid{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px}
.form label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px;min-width:0}
.form input,.form select{font:400 16px var(--text);padding:10px 11px;border:0;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink);width:100%;min-width:0}
.form input:focus,.form select:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--sig)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.frow{display:grid;grid-template-columns:24px minmax(0,1fr) 30% 44px;align-items:center;gap:9px;font-size:12.5px;padding:4px 0}
.frow .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow.me .fn{font-weight:600;color:var(--sig)}
.frow.me .bar i{background:var(--sig)}
.frow .bar i{background:var(--muted)}
.frow b{font:400 14px/1 var(--disp);font-weight:400;text-align:right}
.checking{display:flex;align-items:center;gap:8px}
.spinner{width:13px;height:13px;flex:none;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--muted);animation:spin .8s linear infinite}

/* ---- League ---- */
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 28px/1 var(--disp);font-weight:400}
.ppic{display:flex;gap:14px;align-items:center}
.ppic .fx{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--muted);line-height:1.3}
.ppic .fx b{color:var(--ink);font-weight:600}
.luck{font-size:12.5px;color:var(--muted);line-height:1.45}
.luck b{color:var(--ink);font-weight:600}
.br{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);align-items:center}
.br.one{grid-template-columns:minmax(0,1fr)}
.sd{display:grid;grid-template-columns:18px 24px minmax(0,1fr) auto;gap:7px;align-items:center;padding:7px 8px;border-radius:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);font:600 12px/1.1 var(--text);margin:3px 0}
.sd>span:nth-child(3){overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.sd .s{font:400 13px/1 var(--disp);color:var(--faint)}
.sd em{font-style:normal;font-size:10.5px;color:var(--muted)}

async function api(method,body,w,qs){
  const pin=store.get("dd-pin");
  if(!pin){showPin();throw new Error("PIN needed")}
  let q=qs||(w?`w=${w}`:"");
  if(method==="GET"&&Date.now()<freshUntil&&(!qs||qs.startsWith("action=live")))q+=(q?"&":"")+"fresh=1";
  // Don't wait forever: give up after 55s for a full load or a change, 30s for anything else.
  const ms=method!=="GET"||!qs?55e3:30e3,signal=typeof AbortSignal!=="undefined"&&AbortSignal.timeout?AbortSignal.timeout(ms):undefined;
  let res;
  for(let tries=0;;tries++){
    try{res=await fetch("/api/mfl"+(q?`?${q}`:""),{method,signal,headers:{"x-app-pin":pin,...(body?{"content-type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});break}
    catch(e){
      if(e&&(e.name==="TimeoutError"||e.name==="AbortError"))throw new Error("The server took too long to answer. Try again in a moment.");
      // v36: phone signal drops for a moment all the time, so a read gets one quiet retry, and the message is plain
      // English instead of Safari's "Load failed".
      if(method==="GET"&&!tries&&navigator.onLine!==false){await new Promise(r=>setTimeout(r,800));continue}
      throw new Error(navigator.onLine===false?"You're offline. Showing what's saved on this phone.":"Couldn't reach the server. Check your connection and try again.");
    }
  }
  if(res.headers.get("content-type")?.includes("json")){srvVer=res.headers.get("x-dd-version")||"old";pinWeak=res.headers.get("x-dd-pin-weak")==="1";renderFoot()}
  const data=await res.json().catch(()=>({error:"The server sent an unreadable reply."}));
  if(res.status===401&&data.error==="Wrong PIN."){store.del("dd-pin");showPin("That PIN didn't match. Try again.");throw new Error("PIN")}
  if(!res.ok){const e=new Error(data.error||`Request failed (${res.status})`);e.status=res.status;if(res.status===429)liveHold=Date.now()+300e3;throw e}
  return data;
}

// League switcher (v28): name + my score, thin lime/coral underline = winning/losing, slow fade = live, amber corner dot = needs attention
// v32: league labels read "<number from the name> - <Type>", e.g. "SafeLeagues - 602 - Deluxe (Superflex)" -> "602 - Deluxe".
// 1. Drop the prefix every league shares, cut at a word/separator boundary ("SafeLeagues - ").
// 2. Drop any parenthetical and leftover separators.
// 3. A standalone 1-4 digit number left in the name (before or after the type) leads, as written: "099 - Basic".
//    No number: just the type. Long types lose filler words ("Dynasty", "League"...).
// 4. Only if two labels would still be identical, the last 3 digits of the league ID are added ("Basic · 197").
// The full name stays in the aria-label and tooltip. CSS may ellipsize the type, never the number.
function shortLabels(names,ids,cap){
  cap=cap||12;const SEP=/[\s\-–—|:·\/_,]/,trim=t=>t.replace(/^[\s\-–—|:·\/_,.#]+|[\s\-–—|:·\/_,#]+$/g,"").replace(/\s+/g," ");
  const base=t=>trim(t.replace(/[(\[][^)\]]*[)\]]?/g," "));
  let cut=0;
  if(names.length>1){
    let pre=names[0];names.forEach(n=>{let i=0;while(i<pre.length&&i<n.length&&pre[i]===n[i])i++;pre=pre.slice(0,i)});
    for(let k=pre.length;k>0;k--)if(SEP.test(pre[k-1])&&names.every(n=>base(n.slice(k)))){cut=k;break}
  }
  const title=t=>t.split(" ").map(w=>/[a-z]/.test(w)&&w===w.toLowerCase()||w.length>3&&w===w.toUpperCase()&&/[A-Z]/.test(w)?w[0].toUpperCase()+w.slice(1).toLowerCase():w).join(" ");
  const NUM=/(^|[\s\-–—|:·\/_,#])(\d{1,4})(?=$|[\s\-–—|:·\/_,])/;
  const split=rest=>{const m=rest.match(NUM);if(!m)return{num:"",type:rest};
    const before=trim(rest.slice(0,m.index+m[1].length)),after=trim(rest.slice(m.index+m[0].length));
    // "Brand - 099 - Basic": the type is the part next to the number, not the brand
    const segs=x=>x.split(/\s+[\-–—|:·\/]+\s+|\s*[|:·]\s*/).map(trim).filter(Boolean);
    const type=after?(before&&before.length+after.length>cap?segs(after)[0]:trim(before+" "+after)):segs(before).pop()||"";
    return{num:m[2],type:trim(type||"")}};
  const out=names.map(n=>{
    const rest=base(n.slice(cut))||trim(n.slice(cut))||base(n)||trim(n);
    let{num,type}=split(rest);
    if(!type&&num){const full=split(base(n)||trim(n));if(full.type)type=full.type}
    if(type.length>cap){const simp=trim(type.replace(/\b(dynasty|league|leagues|fantasy|football|ffl|the)\b/gi," ").replace(/\b\d+\b/g," ").replace(/(\s*[\-–—|:·\/_,]\s*)+/g," "));if(simp)type=simp}
    if(!type&&!num)type=trim(n);
    return{num,type:title(type),tail:""};
  });
  const lab=o=>[o.num,o.type].filter(Boolean).join(" - ")+o.tail;
  out.forEach((o,i)=>{if(out.filter(x=>lab(x).toLowerCase()===lab(o).toLowerCase()).length>1){const id=String(ids[i]==null?"":ids[i]),d=id.replace(/\D/g,"");o.idTail=" · "+(d?d.slice(-3).padStart(3,"0"):id.slice(-3))}});
  out.forEach(o=>{if(o.idTail){o.tail=o.idTail;delete o.idTail}});
  return out.map(o=>({...o,label:lab(o)}));
}

  return lgCache.m[l.id]||{type:l.name,num:"",tail:"",label:l.name};

// ---- Matchup and live scoring ----
function pst(l,side,id){
  const p=l.live&&l.live[side]&&l.live[side].players[id],g=G[P(id).team];
  const kicked=g?Date.now()>=g.t*1000:false;
  const secs=p&&p.secs!=null?p.secs:null;
  const started=secs!=null?secs<3600:kicked;
  return{started,final:started&&(secs===0||(secs==null&&g&&Date.now()>g.t*1000+4*3600e3)),secs,actual:p&&p.score!=null?p.score:0};
}
function starters(l,side){
  const s=l.live&&l.live[side];if(!s)return{ids:[],set:false};
  const ids=Object.entries(s.players).filter(([,p])=>p.starter).map(([id])=>id);
  return{ids,set:ids.length>0};
}
function sideTotals(l,side,ids){
  let live=0,proj=0,started=0,left=0,playing=0;
  ids.forEach(id=>{
    const pl=P(id);if(pl.team==="FA"||D.byes.includes(pl.team))return;
    const st=pst(l,side,id),pr=l.proj[id]||0;
    if(st.started){live+=st.actual;started++;proj+=st.actual+(st.final?0:pr*Math.max(0,st.secs??0)/3600);if(!st.final){left++;playing++}}
    else{proj+=pr;left++}
  });
  return{live,proj,started,left,playing};
}
function synced(l){const m=starters(l,"me");if(!m.set)return false;const a=new Set(m.ids),b=lineups[l.id];return a.size===b.size&&[...b].every(x=>a.has(x))}

async function refreshLive(quiet){
  if(!D||liveBusy)return;
  liveBusy=true;if(!quiet){const b=document.querySelector('[data-act="liveref"]');if(b)b.classList.add("spin")}
  try{
    const r=await api("GET",null,null,`action=live&w=${week}&leagues=${encodeURIComponent(D.leagues.map(l=>`${l.id}~${l.host}~${l.fid}`).join(","))}`);
    if(r.week!==week)return;
    const moved=[];
    r.leagues.forEach(x=>{const l=D.leagues.find(y=>y.id===x.id);if(!l||!x.live)return;
      const was=[...lineups[l.id]].sort().join(","),wasBase=mflKey(l);l.live=x.live;
      if(!(confirming&&l.id===cur))reconcile(l);
      if(wasBase&&mflKey(l)!==wasBase&&[...lineups[l.id]].sort().join(",")!==was)moved.push(key(l))});
    if(r.injuries)D.injuries=r.injuries;
    if(r.games&&r.games.length){D.games=r.games;buildG()}
    D.liveAt=r.at;store.set("dd-data",D);recordAllFlows();
    if(moved.length)toast(`Lineup changed on MFL for league ${moved.join(", ")}. Showing it now.`);
    if(!quiet)toast("Scores updated");
  }catch(e){if(!quiet&&e.message!=="PIN"&&e.message!=="PIN needed")toast(e.message)}
  finally{
    liveBusy=false;
    const typing=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
    if(!(faSel||claimUI||confirming||typing))render();
    else{const b=document.querySelector('[data-act="liveref"]');if(b)b.classList.remove("spin")}
  }
}

  if(act==="best"){lineups[l.id]=best(l);saveDraft(l);render();toast("Best projected lineup set")}
  if(act==="ask"){confirming=true;render()}
  if(act==="cancel"){confirming=false;render()}
  if(act==="send"){
    busy=true;render();
    try{await api("POST",{action:"lineup",league:l.id,host:l.host,week,starters:[...lineups[l.id]]});
      freshUntil=Date.now()+120e3; // the next refreshes read MFL directly, so the old lineup can't come back from a cache
      if(l.live&&l.live.me){const pl=l.live.me.players;Object.keys(pl).forEach(k=>pl[k].starter=lineups[l.id].has(k));lineups[l.id].forEach(k=>{if(!pl[k])pl[k]={score:null,secs:null,starter:true}});store.set("dd-data",D)}
      store.del(lk(l)); // MFL now has exactly this lineup, so there's no draft to keep
      toast(`Lineup sent to MFL for league ${key(l)}`)}
    catch(err){if(err.message!=="PIN"&&err.message!=="PIN needed")toast(err.message)}
    busy=false;confirming=false;render();
  }
});

// ---- v36: pull down to refresh ----
// At the top of any screen, pull down and let go to reload that screen from MFL: scores, lineups and projections on
// Lineup, the list and your claims on Free agents, and so on. It skips the server's short cache.
const PTR={y:null,x:0,d:0,busy:false};
const ptrEl=document.createElement("div");ptrEl.className="ptr";ptrEl.setAttribute("aria-hidden","true");ptrEl.innerHTML=ICON_REFRESH;document.body.appendChild(ptrEl);
function ptrHeld(){return PTR.y!=null&&PTR.d>8}
function ptrShow(d,ready){ptrEl.style.transform=`translate(-50%,${Math.round(d)}px) rotate(${Math.round(d*3)}deg)`;ptrEl.style.opacity=String(Math.min(1,d/40));ptrEl.classList.toggle("ready",ready)}
function ptrHide(){ptrEl.classList.remove("ready","spin");ptrEl.style.transition="transform .25s var(--ease),opacity .2s";ptrEl.style.transform="translate(-50%,0)";ptrEl.style.opacity="0";setTimeout(()=>{ptrEl.style.transition=""},260)}
const ptrOK=e=>!!D&&!muOpen&&!wkOpen&&$("isheet").hidden&&cardHost.hidden&&!busy&&!PTR.busy&&window.scrollY<=0&&!e.target.closest("input,select,textarea,.seg,.stbox,.slate,.picker,#pcard,#mu,.wkpop");
addEventListener("touchstart",e=>{if(e.touches.length!==1||!ptrOK(e)){PTR.y=null;return}PTR.y=e.touches[0].clientY;PTR.x=e.touches[0].clientX;PTR.d=0},{passive:true});
addEventListener("touchmove",e=>{if(PTR.y==null)return;const t=e.touches[0],dy=t.clientY-PTR.y,dx=Math.abs(t.clientX-PTR.x);
  if(window.scrollY>0||dy<=0||(PTR.d<12&&dx>dy)){if(PTR.d>8)ptrHide();PTR.y=null;PTR.d=0;return}
  PTR.d=dy;const d=Math.min(96,dy*.55);ptrShow(d,d>=62)},{passive:true});
addEventListener("touchend",()=>{if(PTR.y==null)return;const go=Math.min(96,PTR.d*.55)>=62;PTR.y=null;PTR.d=0;if(go)ptrRefresh();else ptrHide()},{passive:true});
addEventListener("touchcancel",()=>{if(PTR.y!=null){PTR.y=null;PTR.d=0;ptrHide()}},{passive:true});
async function ptrRefresh(){
  PTR.busy=true;ptrEl.classList.add("spin");ptrShow(62,true);
  try{await refreshScreen()}catch(e){}finally{PTR.busy=false;ptrHide();if(renderLater&&!typing()){renderLater=false;render()}}
}
function refreshScreen(){
  const l=D&&D.leagues.find(x=>x.id===cur);
  if(cur==="all"||mode==="lineup"||!l){freshUntil=Date.now()+15e3;return load(week&&week!==nowWeek()?week:null)}
  if(mode==="fa")return Promise.all([loadFA(l),loadBH(l)]);
  if(mode==="st")return Promise.all([loadST(l),loadPO(l)]);
  return Promise.all([loadRK(l),loadST(l)]);
}
// ---- v36: player card ----
// Press and hold any player (or tap one on the full matchup) for his details in one place: injury and what it is,
// this week's game and how tough the defense is, projection or live points, dynasty value and its 30-day trend, age,
// and which of your teams he's on. Start/Bench or Bid are right there too.
let cardId=null;
const cardHost=document.createElement("div");cardHost.id="pcard";cardHost.className="isheet pcard";cardHost.setAttribute("tabindex","-1");cardHost.hidden=true;document.body.appendChild(cardHost);
const kickDay=t=>{if(!t)return"";const d=new Date(t*1000),h=d.getHours(),m=d.getMinutes();return`${(WDAY||(WDAY=new Intl.DateTimeFormat([],{weekday:"short"}))).format(d)} ${h%12||12}${m?`:${String(m).padStart(2,"0")}`:""}${h<12?"a":"p"}`};
function openCard(id){cardId=id;cardAll=false;drawCard();cardHost.querySelector(".isheet-card")?.focus?.({preventScroll:true})}
function closeCard(){cardId=null;cardHost.hidden=true;cardHost.innerHTML=""}
// Bottom sheets (player card, explanations): drag the card down to close it; the page behind doesn't scroll.
function sheetDrag(host,close){
  let y0=null,dy=0,card=null;
  host.addEventListener("touchstart",e=>{card=e.target.closest(".isheet-card");y0=card&&e.touches.length===1?e.touches[0].clientY:null;dy=0;if(card)card.style.transition="none"},{passive:true});
  host.addEventListener("touchmove",e=>{if(card&&card.scrollTop>0){y0=null;return}if(card&&y0!=null&&e.touches[0].clientY<y0)return;e.preventDefault();if(y0==null||!card)return;dy=Math.max(0,e.touches[0].clientY-y0);card.style.transform=dy?`translateY(${dy}px)`:""},{passive:false});
  host.addEventListener("touchend",()=>{if(!card)return;const c=card;c.style.transition="transform .22s var(--ease)";if(dy>90){c.style.transform="translateY(110%)";setTimeout(()=>{c.style.transform="";c.style.transition="";close()},200)}else c.style.transform="";y0=null;dy=0;card=null},{passive:true});
}
sheetDrag(cardHost,closeCard);
sheetDrag($("isheet"),()=>{$("isheet").hidden=true});
// Long press: about half a second without moving. A mouse can right-click instead.
let lpT=null,lpX=0,lpY=0,lpAt=0,lpHeld=false,lpEnd=0;
const lpTarget=el=>el&&el.closest&&el.closest("button.row[data-id],[data-fa].r1,[data-pid]");
const lpId=t=>t.dataset.id||t.dataset.fa||t.dataset.pid;
addEventListener("touchstart",e=>{clearTimeout(lpT);lpT=null;lpEnd=0;lpHeld=false;const t=e.touches.length===1&&lpTarget(e.target);if(!t)return;lpX=e.touches[0].clientX;lpY=e.touches[0].clientY;
  lpT=setTimeout(()=>{lpT=null;lpAt=Date.now();lpHeld=true;PTR.y=null;openCard(lpId(t))},450)},{passive:true});
addEventListener("touchmove",e=>{if(lpT&&Math.hypot(e.touches[0].clientX-lpX,e.touches[0].clientY-lpY)>9){clearTimeout(lpT);lpT=null}},{passive:true});
addEventListener("touchend",()=>{clearTimeout(lpT);lpT=null;if(lpHeld){lpHeld=false;lpEnd=Date.now()}},{passive:true});
addEventListener("touchcancel",()=>{clearTimeout(lpT);lpT=null;lpHeld=false},{passive:true});
addEventListener("contextmenu",e=>{const t=lpTarget(e.target);if(!t)return;e.preventDefault();if(Date.now()-lpAt<900)return;lpAt=Date.now();openCard(lpId(t))});
// The tap that ends a long press shouldn't also start/bench the player or close the card it just opened.
// (Only that one: the next tap you make on the card works normally.)
addEventListener("click",e=>{if(lpEnd&&Date.now()-lpEnd<450){lpEnd=0;e.stopImmediatePropagation();e.preventDefault()}},true);
document.addEventListener("click",e=>{
  if(e.target===cardHost){closeCard();return}
  const c=e.target.closest("[data-card]");
  if(!c){const t=e.target.closest("#mu [data-pid],#view .row.sh[data-pid],#view .pl [data-pid]");if(t)openCard(t.dataset.pid);return}
  const id=cardId,l=D&&D.leagues.find(x=>x.id===(muOpen||(cur==="all"?lastLg():cur)));
  if(c.dataset.card==="close"){closeCard();return}
  if(c.dataset.card==="cmp"){cardAll=!cardAll;drawCard();return}
  if(c.dataset.card==="trade"&&l&&id){
    const d=RK[l.id],mine=l.roster.includes(id),t=!mine&&d&&d.teams?d.teams.find(x=>x.players.includes(id)):null,oppNow=l.live&&l.live.opp&&l.live.opp.players[id]?l.live.opp.id:null,opp=t?t.id:oppNow;
    if(!mine&&!opp){needRK(l);toast("Still loading this league's rosters. Try again in a moment.");return}
    TR={lid:l.id,opp:mine?(TR.lid===l.id?TR.opp:null):opp,a:mine?[`p${id}`]:[],b:mine?[]:[`p${id}`],qa:"",qb:"",add:null,need:null,confirm:false};
    closeCard();cur=l.id;store.set("dd-tab",cur);mode="tr";muOpen=null;renderMU();render();window.scrollTo(0,0);return}
  if(c.dataset.card==="toggle"&&l&&id&&cur!=="all"){const s=lineups[l.id];s.has(id)?s.delete(id):s.add(id);confirming=false;flashId=id;saveDraft(l);closeCard();render();toast(s.has(id)?`${P(id).name} is starting`:`${P(id).name} moved to bench`);return}
  if(c.dataset.card==="bid"&&l&&id){closeCard();mode="fa";faSel=id;bidDraft={amt:"",drop:""};bidConfirm=false;claimUI=null;render();const row=document.querySelector(`button.row[data-fa="${id}"]`);if(row)row.scrollIntoView({block:"center",behavior:RM?"auto":"smooth"});$("bidamt")?.focus({preventScroll:true});return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cardId){e.stopPropagation();closeCard()}else if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("#mu [data-pid],#view [data-pid]")){e.preventDefault();openCard(e.target.dataset.pid)}},true);
// ---- v36: fresh data when you come back to the app ----
// An iPhone keeps the app open in the background. Coming back to it after 10+ minutes reloads quietly; during games,
// scores refresh right away instead of waiting for the next 90-second tick.
let lastLoad=Date.now(),hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();return}
  if(!D||busy||!$("pinbox").hidden)return;
  if(Date.now()-lastLoad>10*60e3)load(week&&week!==nowWeek()?week:null);
  else if(gameWindow()&&Date.now()-hiddenAt>60e3&&Date.now()>liveHold)refreshLive(true);
});
addEventListener("online",()=>{if(D&&Date.now()-lastLoad>60e3)load(week&&week!==nowWeek()?week:null)});
addEventListener("offline",()=>{const s=$("sub");if(s&&D)s.textContent="Offline · showing what's saved on this phone"});
// v36: hide the bottom bars while typing in a text or number box (they'd float above the keyboard on iPhone).
const textBox=el=>el&&el.tagName==="INPUT"&&/^(text|search|number|password|tel)$/.test(el.type);
document.addEventListener("focusin",e=>{if(textBox(e.target))document.body.classList.add("typing")});
document.addEventListener("focusout",e=>{if(textBox(e.target))setTimeout(()=>{if(!textBox(document.activeElement))document.body.classList.remove("typing")},60)});
// v35: iPhone Safari only shows :active press states when a touchstart listener exists. This empty one turns them on,
// so buttons, rows and tabs react the moment your finger lands.
document.addEventListener("touchstart",()=>{},{passive:true});
$("pinform").addEventListener("submit",e=>{e.preventDefault();const v=$("pin").value.trim();if(!v)return;store.set("dd-pin",v);$("pin").value="";$("pinbox").hidden=true;load(wkWant||week)});
$("retry").addEventListener("click",()=>load(wkWant||week)); // retries the week you asked for
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&wkOpen){e.stopPropagation();closeWeekList(true)}},true);
window.addEventListener("resize",()=>{if(wkOpen)closeWeekList()});
// The app always opens on the current week. A saved copy of another week isn't shown first, so it can't flash up.
// (it stays in memory as the fallback if MFL can't be reached).
if(D&&curWeek&&D.week!==curWeek)$("view").innerHTML=skeleton();
else if(D){try{prepare();render();loadValues()}catch(e){D=null}}
renderFoot();
load(null);
// v36: a small service worker (sw.js) opens the app from this phone's copy when the network is slow or gone,
// and keeps the fonts and artwork. Your MFL data always comes from the network. It tells us when a newer
// version of the app arrived late, so you can switch to it with one tap.
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="dd-update"){const u=$("upd");if(u)u.hidden=false}});
}
$("upd").addEventListener("click",()=>location.reload());
</script>
