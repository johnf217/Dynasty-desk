<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dynasty Desk">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0C0E">
<title>Dynasty Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Dynasty Desk — broadcast graphics system.
   One idea: Sunday-TV scorebugs. Tall condensed numerals (Big Shoulders) for anything you'd see on a scoreboard,
   Archivo (normal width for names, condensed width for game details) for everything else.
   One signal color: lime means "yours / act". Live is a red dot with plain numbers. Red text means a problem.
   Row rule: left side says who and against whom; right side says how many points and when.
   One NFL logo per player, their own team. Three radii: 22 containers, 12 controls, 10 plates. */
:root{
  --paper:#F1F1EE; --surface:#FFFFFF; --sunk:#E9E9E5; --line:#DCDCD6; --ink:#121214; --muted:#5F5F66; --faint:#94949B;
  --sig:#BFF135; --sig-ink:#3B6400; --on-sig:#101114;
  --live:#FF3B30; --bad:#C8102E; --warn:#A85500;
  --qb:#D43A6E; --rb:#0E9384; --wr:#2563EB; --te:#D9740A;
  --board:#141518; --board-2:#2A2C33; --board-ink:#F3F3F5; --board-muted:#A3A5AD; --field-a:#2C2E35; --field-b:#272930;
  --shadow-2:0 24px 48px -24px rgb(18 18 22 / .55),0 2px 6px rgb(18 18 22 / .10);
  --r-lg:22px; --r-md:12px; --r-sm:10px;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --text:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B0B0D; --surface:#141417; --sunk:#1B1B1F; --line:#26262B; --ink:#EDEDEF; --muted:#9A9AA2; --faint:#64646C;
  --sig:#C6F432; --sig-ink:#C6F432; --on-sig:#0E0F11;
  --live:#FF453A; --bad:#FF6B5E; --warn:#F2A14D;
  --qb:#EC5C8C; --rb:#1DB5A3; --wr:#4F8CF7; --te:#F29530;
  --board:#17181C; --board-2:#2C2E36; --field-a:#2D2F37; --field-b:#282A31;
  --shadow-2:0 24px 48px -24px rgb(0 0 0 / .85);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--text);font-stretch:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sig-ink);outline-offset:2px}
.cond{font-stretch:75%}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.005em}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:14px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
body.has-bar .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:var(--r-md);background:var(--board);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:22px}
h1{font:800 27px/1 var(--display);letter-spacing:.01em;margin:0;white-space:nowrap}
#sub{margin:3px 0 0;font-size:12.5px;font-stretch:75%;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:2px;flex:none;background:var(--surface)}
.week button{width:32px;height:32px;border:0;background:none;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.week button:hover{background:var(--sunk);color:var(--ink)}
.week button svg{width:16px;height:16px}
.week span{font:800 18px/1 var(--display);min-width:64px;text-align:center;letter-spacing:.02em}

/* League switcher */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));padding:4px;background:color-mix(in srgb,var(--sunk) 88%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-radius:var(--r-md)}
.tabs:empty{display:none}
.tabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n,4));transform:translateX(calc(var(--i,0) * 100%));background:var(--surface);border-radius:9px;box-shadow:0 1px 2px rgb(0 0 0 / .08),0 6px 14px -8px rgb(0 0 0 / .3);transition:transform .4s var(--ease)}
.tab{position:relative;z-index:1;border:0;background:none;padding:7px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;color:var(--muted)}
.tab b{font:800 22px/1 var(--display);color:var(--ink);opacity:.45;transition:opacity .25s}
.tab span{font-size:12px;font-stretch:75%;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] b{opacity:1}
.tab[aria-selected="true"] span{color:var(--ink)}
.fixdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:4px;vertical-align:1px}

/* Scoreboard (kept: this is the app's one loud element) */
.board{--ink:var(--board-ink);--muted:var(--board-muted);--faint:#6E7078;--line:rgb(255 255 255 / .09);--sunk:rgb(255 255 255 / .06);--surface:var(--board);--sig-ink:var(--sig);--bad:#FF7B6E;
  position:relative;overflow:hidden;color:var(--ink);background:radial-gradient(130% 100% at 50% -20%,var(--board-2),var(--board) 62%);border-radius:var(--r-lg);padding:16px 16px 14px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:14px}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-stretch:75%;color:var(--muted)}
.board-label{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:600}
.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.team{display:flex;flex-direction:column;min-width:0;gap:3px}
.team.r{text-align:right;align-items:flex-end}
.team .tid{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;max-width:100%}
.team.r .tid{align-items:flex-end}
.tname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.score{font:800 min(56px,12vw)/.92 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);transition:color .4s}
.team.lead .score{color:var(--ink)}
.tsub{font-size:13px;font-stretch:75%;color:var(--muted);font-variant-numeric:tabular-nums}
.field{position:relative;height:30px;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--field-a) 0 5%,var(--field-b) 5% 10%);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .07)}
.field::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgb(255 255 255 / .16) calc(10% - 1px) 10%)}
.field .ez{position:absolute;top:0;bottom:0;width:8%}
.field .ez.l{left:0;background:color-mix(in srgb,var(--sig) 70%,transparent)}
.field .ez.r{right:0;background:rgb(255 255 255 / .08)}
.field .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgb(255 255 255 / .5)}
.field .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--sig) 24%,transparent));border-right:2px solid var(--sig)}
.field .ball{position:absolute;top:50%;width:22px;height:13px;margin:-6.5px 0 0 -11px;border-radius:50%;background:radial-gradient(60% 60% at 40% 35%,#A65E2E,#7A3F18);box-shadow:0 3px 6px rgb(0 0 0 / .45)}
.field .ball::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;margin-top:-1px;background:#F6F0E8;border-radius:1px}
.board.intro .fill{animation:fillIn 1.2s var(--ease) .2s both}
.board.intro .ball{animation:kick 1.2s var(--ease) .2s both}
@keyframes fillIn{from{width:50%}}
@keyframes kick{from{left:50%}}
.field-key{display:flex;justify-content:space-between;font-size:13px;font-stretch:75%;color:var(--muted);margin-top:-6px;font-variant-numeric:tabular-nums}
.field-key b{color:var(--sig);font-weight:700}
.board-note{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.board-alert{margin:0;display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--bad) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad);font-size:13.5px;font-weight:600;line-height:1.4}
.board-alert svg{width:16px;height:16px;flex:none;margin-top:1px}
.board-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;font-stretch:75%;color:var(--muted)}
.ghost{white-space:nowrap;flex:none;border:1px solid rgb(255 255 255 / .14);background:rgb(255 255 255 / .05);border-radius:var(--r-md);padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:background .2s,transform .12s var(--ease)}
.ghost:hover{background:rgb(255 255 255 / .1)}
.ghost:active{transform:scale(.97)}
.ghost svg{width:14px;height:14px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);flex:none;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}80%,100%{box-shadow:0 0 0 6px transparent}}

/* Panels: one surface, nothing boxed inside it except flat strips */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head h3{font:800 22px/1 var(--display);margin:0;letter-spacing:.01em}
.panel-head span{font-size:13px;font-stretch:75%;color:var(--muted)}
.tp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-stretch:75%}
.tp-head .fmt{color:var(--muted);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:2px;background:currentColor}
.s-ok{color:var(--ink)}.s-ok i{background:var(--sig)}
.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}
.seg{position:relative;display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;background:var(--sunk);border-radius:var(--r-md);padding:3px}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:var(--sw,20%);left:var(--sx,3px);background:var(--surface);border-radius:9px;box-shadow:0 1px 2px rgb(0 0 0 / .08),0 3px 10px -5px rgb(0 0 0 / .3);transform:translateX(calc(var(--i,0) * 100%));transition:transform .35s var(--ease)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.swap{display:flex;flex-direction:column;gap:14px}
.swap.in{animation:swapIn .32s var(--ease)}
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}}

/* Strips: flat rows of figures, divided by hairlines (used for slot counts, FAAB, standings summary) */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--sunk);border-radius:var(--r-md)}
.strip .cell{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .cell+.cell{box-shadow:inset 1px 0 0 var(--line)}
.strip .k{font-size:12.5px;font-stretch:75%;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.strip .k i{width:8px;height:8px;border-radius:2px;background:var(--pc)}
.strip b{font:800 26px/1.05 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip b small{font:400 12.5px var(--text);font-stretch:75%;color:var(--muted);margin-left:4px}
.strip .s{font-size:12.5px;font-stretch:75%;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .s.warn{color:var(--warn)}
.strip .cell.off b{color:var(--bad)}
.QB{--pc:var(--qb)}.RB{--pc:var(--rb)}.WR{--pc:var(--wr)}.TE{--pc:var(--te)}

/* Player rows */
.list-head{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600;padding-inline:2px;margin-bottom:-6px}
.list-head small{font-size:13px;font-stretch:75%;font-weight:400;color:var(--muted);margin-left:6px}
.list{display:flex;flex-direction:column;margin-inline:-8px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto 22px;align-items:center;gap:11px;width:100%;min-height:58px;padding:8px 8px;border:0;background:none;border-radius:var(--r-md);text-align:left;cursor:pointer;position:relative;transition:background .18s,transform .12s var(--ease)}
.row+.row::before,.row+.sheet+.row::before{content:"";position:absolute;top:0;left:55px;right:8px;border-top:1px solid var(--line)}
.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row:active{transform:scale(.985)}
.row.static{grid-template-columns:36px minmax(0,1fr) auto;cursor:default}
.row.static:hover{background:none}.row.static:active{transform:none}
.row.fa{grid-template-columns:36px minmax(0,1fr) auto auto}
.row.sel{background:var(--sunk)}
.ptag{--pc:var(--faint);height:32px;border-radius:var(--r-sm);display:grid;place-items:center;font:800 15px/1 var(--display);letter-spacing:.05em;color:#fff;background:var(--pc)}
.ptag.QB{--pc:var(--qb)}.ptag.RB{--pc:var(--rb)}.ptag.WR{--pc:var(--wr)}.ptag.TE{--pc:var(--te)}
.nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .hs{grid-area:auto;width:36px;height:36px}
.row .hsi{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.row .hsb{background:var(--surface);box-shadow:0 0 0 1.5px var(--surface)}
.pos{font:700 13px/1 var(--display);letter-spacing:.05em;color:var(--pc)}
.pn{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600;font-size:16px;line-height:1.2}
.pn .inj,.pn .rk,.pn .stk{text-transform:none;letter-spacing:0;font-family:var(--text)}
.pn .nmx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn>*:not(.nmx){flex:none}
.rk{font-size:12px;font-stretch:75%;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);padding:0 5px;border-radius:5px;line-height:17px}
.inj{font-size:12px;font-stretch:75%;font-weight:700;color:var(--warn);box-shadow:inset 0 0 0 1.5px currentColor;padding:0 5px;border-radius:5px;line-height:17px}
.inj.out{color:var(--bad)}
.stk{font-size:12px;font-stretch:75%;font-weight:600;color:var(--warn)}
.opp{display:flex;align-items:center;gap:8px;font-size:13.5px;font-stretch:75%;color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0}
.opp .vs{color:var(--ink);font-weight:500}
.opp .dr{color:var(--faint)}
.opp .dr.tough{color:var(--bad)}
.opp .out{color:var(--bad);font-weight:500}
.pv{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pts{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums;border-radius:4px}
.pts.zero{color:var(--faint)}
.gs{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-stretch:75%;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.gs.on{color:var(--ink);font-weight:600}
.gs .livedot{width:6px;height:6px}
.tg{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--muted) 45%,transparent);display:grid;place-items:center;transition:background .2s,border-color .2s}
.row.on .tg{background:var(--sig);border-color:var(--sig)}
.row.on .tg::after{content:"";width:8px;height:4px;border-left:2px solid var(--on-sig);border-bottom:2px solid var(--on-sig);transform:translateY(-1px) rotate(-45deg)}
.row.flash{animation:flash 1.1s var(--ease)}
.row.flash .tg{animation:pop .4s var(--ease)}
@keyframes flash{0%{background:color-mix(in srgb,var(--sig) 26%,transparent)}100%{background:transparent}}
@keyframes pop{45%{transform:scale(1.25)}}
.bump{animation:bump 1.4s var(--ease)}
@keyframes bump{0%{background:color-mix(in srgb,var(--sig) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--sig) 55%,transparent);transform:scale(1.12)}100%{background:transparent;box-shadow:0 0 0 4px transparent;transform:none}}
.bidpill{font-size:13.5px;font-weight:600;border:1px solid var(--line);border-radius:var(--r-md);padding:6px 13px;transition:background .2s,color .2s}
.row.sel .bidpill{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Logos */
.tl{--tc:#555;position:relative;display:inline-grid;place-items:center;width:var(--sz,18px);height:var(--sz,18px);border-radius:50%;background:var(--tc);color:#fff;font:700 calc(var(--sz,18px) * .34)/1 var(--text);font-stretch:75%;flex:none;overflow:hidden;vertical-align:middle}
.tl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:9%;opacity:0;transition:opacity .25s}
.tl.ok{background:transparent}
.tl.ok img{opacity:1;padding:0}.tl.ok b{visibility:hidden}
.tl b{font:inherit}
.ft{--sz:40px;width:var(--sz);height:var(--sz);border-radius:var(--r-md);display:grid;place-items:center;overflow:hidden;flex:none;background:rgb(255 255 255 / .08);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .12);font:800 16px/1 var(--display);color:var(--ink);position:relative}
.ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ft.sm{--sz:22px;border-radius:6px;font-size:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}

/* Forms and sheets */
.sheet{margin:2px 8px 10px;padding:14px;border-radius:var(--r-md);background:var(--sunk);display:flex;flex-direction:column;gap:12px;animation:open .3s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}}
.sheet .q{font-weight:600;font-size:15px;line-height:1.35}
.fgrid{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.sheet label{font-size:12.5px;font-stretch:75%;color:var(--muted);display:flex;flex-direction:column;gap:6px;min-width:0}
.sheet input,.sheet select{font:400 16px var(--text);padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.sheet input:focus,.sheet select:focus{outline:none;border-color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:var(--r-md);padding:12px 17px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;transition:transform .12s var(--ease),background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sig);color:var(--on-sig)}
.btn.primary:hover{background:color-mix(in srgb,var(--sig) 88%,var(--ink))}
.btn.danger{background:var(--bad);color:#fff}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.quiet:hover{background:color-mix(in srgb,var(--sunk) 70%,var(--line))}
.btn.sm{padding:7px 12px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.ab{pointer-events:auto;max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 16px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);box-shadow:0 20px 44px -18px rgb(0 0 0 / .4)}

/* FAAB and free agents */

.fv{text-align:right;font:800 17px/1 var(--display);font-variant-numeric:tabular-nums}
.claims{display:flex;flex-direction:column}

.search{position:relative;display:block}
.search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.search input{width:100%;font:400 16px var(--text);padding:12px 12px 12px 40px;border-radius:var(--r-md);border:1px solid transparent;background:var(--sunk);color:var(--ink);transition:background .2s,border-color .2s}

.search input:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:7px 15px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);flex:none;transition:background .2s,color .2s,border-color .2s,transform .12s var(--ease)}

/* Overview */
.glance{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 2px;border:0;background:none;cursor:pointer;text-align:left;width:100%;transition:opacity .2s}

.grow .lg{font:800 28px/1 var(--display)}
.grow .gn{min-width:0}
.grow .gn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gn small{color:var(--muted);font-size:13px;font-stretch:75%}
.grow .gr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;font-stretch:75%}
.grow .gt{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums}

/* Full matchup screen */
.mv{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));animation:mvIn .38s var(--ease)}

@keyframes mvIn{from{transform:translateY(28px);opacity:0}}
@keyframes mvOut{to{transform:translateY(28px);opacity:0}}
.iconbtn{width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}

/* Full matchup: broadcast look. Always dark; you are blue, they are red. */
.mv{--paper:#07080B;--surface:#111318;--sunk:#171920;--line:rgb(255 255 255 / .08);--ink:#F3F4F6;--muted:#9CA1AB;--faint:#5E636D;
  --me:#C6F432;--me-rgb:198 244 50;--me-ink:#D4FA5A;--op:#B4BAC6;--op-rgb:180 186 198;--op-ink:#FFFFFF;--clock:var(--ink);
  --bc:"Barlow Condensed","Big Shoulders Display","Arial Narrow",sans-serif;color-scheme:dark;color:var(--ink)}

.livepill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;background:rgb(255 255 255 / .1);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .16);color:#fff;font:700 15px/1 var(--bc);letter-spacing:.1em;flex:none}
.livepill i{width:8px;height:8px;border-radius:50%;background:var(--live)}
.mvhero{margin-top:-58px;padding:66px 18px 22px;background:
  linear-gradient(180deg,transparent 40%,var(--paper) 100%),
  radial-gradient(70% 110% at 0% 0%,rgb(var(--me-rgb) / .34),transparent 70%),
  radial-gradient(70% 110% at 100% 0%,rgb(var(--op-rgb) / .26),transparent 70%),
  linear-gradient(104deg,#20260F 0%,#171A12 40%,#121316 49.6%,#16171B 50.4%,#23262C 62%,#2E3239 100%)}
.mv .board.mvh{background:none;box-shadow:none;border-radius:0;padding:0;gap:20px;overflow:visible}

.mvh .ft{--sz:46px;border-radius:50%;background:rgb(255 255 255 / .08);box-shadow:inset 0 0 0 2px var(--op);font:700 18px/1 var(--bc);color:#fff}

.mvh .tsub{font-size:15px;font-stretch:100%;color:rgb(255 255 255 / .62)}
.mvh .vs{position:absolute;left:50%;top:90px;transform:translateX(-50%);font:italic 800 22px/1 var(--bc);color:rgb(255 255 255 / .8);letter-spacing:.02em}
.wp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font:700 18px/1 var(--bc);letter-spacing:.07em;color:#fff;text-transform:uppercase;font-variant-numeric:tabular-nums}
.wp .wmid{text-align:center;color:rgb(255 255 255 / .72);text-transform:none;letter-spacing:.05em}
.wpbar{grid-column:1/-1;display:flex;gap:3px;height:9px;margin-top:6px}
.wpbar i{border-radius:99px;background:var(--me);transition:flex-grow .6s var(--ease)}
.wpbar i+i{background:var(--op)}
.mv .mvh .team:not(.r) .score{color:var(--me)}
.mv-in{max-width:620px;margin:0 auto;padding:2px 10px 0;display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr)}
.bslot{display:grid;place-items:center;font:700 16px/1 var(--bc);letter-spacing:.06em;color:var(--muted)}
/* Two lines per player: photo + name, then opponent/status opposite the points. */
.bcell{display:grid;grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"h n n" "m m p";column-gap:8px;row-gap:5px;align-items:center;min-width:0;padding:9px 9px 10px 10px;border-radius:12px 4px 4px 12px}
.bcell.r{grid-template-columns:auto minmax(0,1fr) 34px;grid-template-areas:"n n h" "p m m";padding:9px 10px 10px 9px;border-radius:4px 12px 12px 4px;text-align:right}
.hs{grid-area:h;position:relative;width:34px;height:34px}
.hsi{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,#2A2D35,#1A1C21);box-shadow:inset 0 0 0 1.5px rgb(255 255 255 / .14);font:700 13px/1 var(--bc);color:var(--faint)}

.bcell>*{min-width:0}
.bn{grid-area:n;display:flex;align-items:center;gap:5px;font:700 20px/1 var(--bc);text-transform:uppercase;letter-spacing:.01em;color:#fff}
.bcell.r .bn{justify-content:flex-end}
.bn>span:first-child{overflow:hidden;text-overflow:clip;white-space:nowrap;min-width:0}
.bm{grid-area:m;display:flex;flex-direction:column;gap:2px;min-width:0}
.bcell.r .bm{align-items:flex-end}
.bg,.bs{font-size:14px;line-height:1.2;color:var(--muted);font-stretch:87.5%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bs.on{display:block;overflow:hidden;color:var(--clock);font-variant-numeric:tabular-nums}
.bs.on i{display:inline-block;vertical-align:.12em;margin-right:5px;width:7px;height:7px;border-radius:50%;background:var(--live)}
.bpq{grid-area:p;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bcell.r .bpq{align-items:flex-start}
.bp{font:700 26px/.95 var(--bc);font-variant-numeric:tabular-nums;color:#C3C6CD;letter-spacing:-.005em;border-radius:4px}
.bq{font-size:13px;line-height:1.2;color:var(--muted);font-stretch:87.5%;white-space:nowrap;font-variant-numeric:tabular-nums}
.bpq.pre .bq{font-size:14px}
.bpq.pre .bq b{font:700 17px/1 var(--bc);color:#D7D9DE;margin-left:3px;letter-spacing:.01em}
.bcell.win{background:linear-gradient(90deg,rgb(var(--me-rgb) / .2),rgb(var(--me-rgb) / .04));box-shadow:inset 3px 0 0 var(--me)}

.bcell.win .bp{color:var(--me-ink)}
.bcell.r.win .bp{color:var(--op-ink)}
.bcell.lean{background:linear-gradient(90deg,rgb(var(--me-rgb) / .09),transparent 85%);box-shadow:inset 2px 0 0 rgb(var(--me-rgb) / .5)}
.bcell.r.lean{background:linear-gradient(270deg,rgb(var(--op-rgb) / .09),transparent 85%);box-shadow:inset -2px 0 0 rgb(var(--op-rgb) / .5)}
.bcell.empty{grid-template-areas:"n n n"}
.bcell.empty .bg{grid-area:n;color:var(--faint)}
.bench .hsi img{filter:saturate(.7) brightness(.9)}
.benchbtn{margin-top:14px;display:flex;justify-content:center;align-items:center;gap:14px;width:100%;padding:18px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:#fff;font:700 18px/1 var(--bc);letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
.benchbtn b{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.benchbtn svg{width:14px;height:14px;transition:transform .3s var(--ease)}
.benchbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.benchbtn span{color:var(--muted)}
.bench{display:flex;flex-direction:column;gap:6px;margin-top:6px}

.bench .bn{color:rgb(255 255 255 / .82)}
.mnote{font-size:13.5px;color:var(--muted);margin:10px 0 0;padding-inline:6px;line-height:1.5;text-align:center}
.bcell .inj{font-family:var(--text)}

.lbrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:var(--surface)}
.lbrow.me{box-shadow:inset 3px 0 0 var(--me);background:linear-gradient(90deg,rgb(var(--me-rgb) / .1),var(--surface) 60%)}
.lbt{display:flex;align-items:center;gap:7px;min-width:0;font-size:13.5px;font-weight:600}
.lbt.r{flex-direction:row-reverse;text-align:right}
.lbn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Standings */

/* States */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--bad) 8%,var(--surface));color:var(--bad);font-weight:500;font-size:14px;border:1px solid color-mix(in srgb,var(--bad) 25%,transparent)}
.pin{align-items:center;text-align:center;padding:30px 22px;gap:12px}

@media (max-width:380px){.ab{padding-left:12px}.ab-total{font-size:26px}.btn{padding-inline:13px}.row{gap:10px}}
/* Shared-element morph between the scoreboard and the full matchup screen (View Transitions) */
::view-transition-group(*){animation-duration:.46s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s}
::view-transition-old(mu-board),::view-transition-new(mu-board){height:100%;object-fit:cover;object-position:top}
::view-transition-old(mu-score-me),::view-transition-new(mu-score-me),::view-transition-old(mu-score-opp),::view-transition-new(mu-score-opp),
::view-transition-old(mu-name-me),::view-transition-new(mu-name-me),::view-transition-old(mu-name-opp),::view-transition-new(mu-name-opp){height:100%;object-fit:contain}
.mv.vt{animation:none}
.teams.tap,.field[data-act]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.teams.tap:active{transform:scale(.985);transition:transform .12s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Compact matchup rows: one line per player each side, position and point gap in the middle */
.mv-in{max-width:620px;margin:0 auto;padding:0;display:flex;flex-direction:column;gap:0}
.brow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto 42px auto minmax(0,1fr);align-items:center;column-gap:6px;padding:7px 8px;border-top:1px solid var(--line)}
.brow.wa{background:linear-gradient(90deg,rgb(var(--me-rgb) / .13),transparent 55%)}
.brow.wa::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--me)}
.brow.wb{background:linear-gradient(270deg,rgb(var(--op-rgb) / .13),transparent 55%)}

<script>
const $=id=>document.getElementById(id);

function logo(t,sz){const a=tm(t);if(!TC[a])return"";const e=a==="WAS"?"wsh":a.toLowerCase();return`<span class="tl" style="--tc:${TC[a]};--sz:${sz||20}px"><b>${a}</b><img src="https://a.espncdn.com/i/teamlogos/nfl/500/${e}.png" alt="" loading="lazy" decoding="async" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span>`}

}
const prevPts={};
function bumpScores(root){

  root.querySelectorAll("[data-pk]").forEach(el=>{const k=el.dataset.pk,v=+el.dataset.pv;
    if(prevPts[k]!=null&&v>prevPts[k]+.001&&!RM){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}

}
const ICON_REFRESH=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>`;
const ICON_SEARCH=`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>`;

let D=store.get("dd-data"),cur=store.get("dd-tab"),week=null,lineups={},confirming=false,busy=false;
let mode="lineup",FA={},faPos="ALL",faQ="",faShow=50,faSel=null,bidConfirm=false;
let liveHold=0; // after MFL says "too many requests", auto-refresh pauses for 5 minutes

// Version of this page. The server sends its own version, so a mismatch means one file wasn't uploaded.
const APP_VERSION="v21";
let srvVer=null,pinWeak=false;
function renderFoot(){

  if(srvVer&&srvVer!==APP_VERSION)lines.push(`<span class="warn">The server file is ${srvVer==="old"?"an older version":srvVer}. Upload the matching mfl.mjs too.</span>`);

  el.innerHTML=lines.map(x=>`<span>${x}</span>`).join("");
}
async function api(method,body,w,qs){
  const pin=store.get("dd-pin");
  if(!pin){showPin();throw new Error("PIN needed")}
  const res=await fetch("/api/mfl"+(qs?`?${qs}`:w?`?w=${w}`:""),{method,headers:{"x-app-pin":pin,...(body?{"content-type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  if(res.headers.get("content-type")?.includes("json")){srvVer=res.headers.get("x-dd-version")||"old";pinWeak=res.headers.get("x-dd-pin-weak")==="1";renderFoot()}
  const data=await res.json().catch(()=>({error:"The server sent an unreadable reply."}));
  if(res.status===401&&data.error==="Wrong PIN."){store.del("dd-pin");showPin("That PIN didn't match. Try again.");throw new Error("PIN")}
  if(!res.ok){const e=new Error(data.error||`Request failed (${res.status})`);e.status=res.status;if(res.status===429)liveHold=Date.now()+300e3;throw e}

}
function showPin(msg){$("pinbox").hidden=false;if(!D)$("view").innerHTML="";if(msg)toast(msg);$("pin").focus()}

function skeleton(){return`<div class="sk" style="height:212px"></div><div class="sk" style="height:420px;border-radius:20px"></div>`}

async function load(w){

    if(D){prepare();render();$("sub").textContent=`Saved copy from ${new Date(D.generated).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"})}`}
    else if(e.message!=="PIN needed"&&e.message!=="PIN")$("view").innerHTML=""}
}

function key(l){const m=l.name.match(/Dynasty\s+(\d+)/i);return m?m[1]:l.id}
function prepare(){
  week=D.week;G={};
  D.games.forEach(g=>{G[g.away.id]={opp:g.home,home:false,t:g.kickoff};G[g.home.id]={opp:g.away,home:true,t:g.kickoff}});
  owned={};D.leagues.forEach(l=>l.roster.forEach(id=>(owned[id]=owned[id]||[]).push(key(l))));
  lineups={};D.leagues.forEach(l=>reconcile(l));
  pruneDrafts();
  if(!D.leagues.some(l=>l.id===cur)&&cur!=="all")cur=D.leagues[0]?.id;
  $("weekbar").hidden=false;$("wklbl").textContent=`Week ${week}`;
  $("sub").textContent=`Updated ${new Date(D.generated).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})} from MFL`;
}
const lk=l=>`dd-lu-${D.year}-${week}-${l.id}`;
// MFL is the source of truth for your lineup. A lineup you edit here is saved as a draft along with

// if MFL changes (you set it on the MFL site or another device), the app follows MFL instead.
const mflKey=l=>{const m=starters(l,"me");return m.set?m.ids.filter(id=>l.roster.includes(id)).sort().join(","):""};
// Drafts from earlier weeks or seasons are never needed again; clear them so they don't pile up.
function pruneDrafts(){

    for(let i=localStorage.length-1;i>=0;i--){
      const k=localStorage.key(i),m=k&&k.match(/^dd-lu-(\d{4})-(\d+)-/);
      if(m&&(m[1]!==String(D.year)||+m[2]<week-1))localStorage.removeItem(k);
    }
  }catch(e){}
}
function saveDraft(l){store.set(lk(l),{ids:[...lineups[l.id]],base:mflKey(l)})}
function reconcile(l){
  const m=starters(l,"me"),base=mflKey(l),d=store.get(lk(l));
  let ids;
  if(d&&!Array.isArray(d)&&Array.isArray(d.ids)&&d.base===base)ids=d.ids;  // your unsent edits to this MFL lineup
  else if(m.set)ids=m.ids;                                                  // follow what's actually set on MFL
  else if(d)ids=Array.isArray(d)?d:d.ids;                                   // nothing set on MFL yet: keep your draft

}
const faKey=l=>`${l.id}-${week}`;
const P=id=>D.players[id]||Object.values(FA).find(f=>f.players&&f.players[id])?.players[id]||{name:`Player ${id}`,pos:"?",team:"?"};
const pts=(l,id)=>l.proj[id]||0;
const lim=(l,p)=>l.starters.limits[p]||[0,0];
const me=l=>l.franchises.find(f=>f.id===l.fid)||{};

function best(l){
  const n=l.starters.count||10,pick=new Set(),c={};
  const by=p=>l.roster.filter(id=>P(id).pos===p).sort((a,b)=>pts(l,b)-pts(l,a));
  POS.forEach(p=>{c[p]=0;by(p).slice(0,lim(l,p)[0]).forEach(id=>{pick.add(id);c[p]++})});
  l.roster.filter(id=>!pick.has(id)&&POS.includes(P(id).pos)).sort((a,b)=>pts(l,b)-pts(l,a)).forEach(id=>{const p=P(id).pos;if(pick.size<n&&c[p]<lim(l,p)[1]){pick.add(id);c[p]++}});
  return pick;
}
const total=l=>[...lineups[l.id]].reduce((s,id)=>s+pts(l,id),0);
function state(id,l){const p=P(id);if(p.team==="FA")return"fa";if(D.byes.includes(p.team))return"bye";const i=D.injuries[id];if(i&&/out|ir|suspend/i.test(i.status))return"out";if(!(id in l.proj))return"none";return"ok"}
function check(l){
  const set=lineups[l.id],n=l.starters.count||10,c={QB:0,RB:0,WR:0,TE:0};set.forEach(id=>{const p=P(id).pos;if(p in c)c[p]++});
  const issues=[];

}
function alerts(l){
  const now=Date.now();
  return[...lineups[l.id]].filter(id=>{
    const st=state(id,l);if(st!=="out"&&st!=="bye"&&st!=="fa")return false;

  }).map(id=>{const st=state(id,l),inj=D.injuries[id];return{id,why:st==="bye"?"on bye":st==="fa"?"not on a team":/^ir/i.test(inj?.status||"")?"on IR":(inj?.status||"Out").toLowerCase()}});
}
function alertLine(l){

  return`<p class="board-alert" role="alert"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8 15 14H1z"/><path d="M8 6.5v3.2M8 11.8v.01"/></svg><span>${txt}</span></p>`;
}
// ---- Dynasty values (FantasyCalc, via /api/mfl?type=values) ----

const VALS={},VALP={};let valErr=false;

const valKey=l=>{const p=valParams(l);return`${p.qbs}-${p.ppr}`};
async function loadValues(){
  if(!D)return;

  await Promise.all(keys.map(async k=>{
    if(VALS[k])return;

    if(c&&c.values&&now-c.t<24*3600e3){VALS[k]=c.values;VALP[k]=c.picks||{};changed=true;return}
    const[qbs,ppr]=k.split("-");

const valOf=(l,id)=>{const v=VALS[valKey(l)];return v?(v[id]||null):undefined};
// Value column: dynasty value on top, 30-day trend under it. Empty while values are missing; "—" if the player has none.
function valChip(l,id){

  if(!v)return`<span class="dv none" title="No dynasty value"><b>—</b></span>`;
  const[n,t]=v,dir=t>0?"up":t<0?"dn":"flat";
  return`<span class="dv" title="Dynasty value, 30-day change ${t>0?"+":""}${t}"><b>${n.toLocaleString("en-US")}</b><i class="${dir}">${dir==="up"?"▲ ":dir==="dn"?"▼ ":""}${t?Math.abs(t).toLocaleString("en-US"):"—"}</i></span>`;
}
// Section header with column labels ("VALUE", "PTS"/"PROJ") lined up over the row columns.
function colHead(title,count,pts,fa){
  const l=D.leagues.find(x=>x.id===cur),hasV=l&&VALS[valKey(l)];
  return`<div class="list-head lhc${hasV?"":" novals"}${fa?" fa":""}"><span class="lt">${title}<small>${count}</small></span>${hasV?`<span class="ch">Value</span>`:""}<span class="ch">${pts}</span><span></span></div>`;
}
const valCol=id=>{const l=D.leagues.find(x=>x.id===cur);return l&&VALS[valKey(l)]?valChip(l,id):""};
function oppLine(id){
  const p=P(id);
  const ps=`<span class="pos ${esc(p.pos)}">${esc(p.pos)}</span>`;
  if(p.team==="FA")return`<span class="opp">${ps}<span class="out">Free agent</span></span>`;
  if(D.byes.includes(p.team))return`<span class="opp">${ps}<span class="out">Bye week</span></span>`;
  const g=G[p.team];if(!g)return`<span class="opp">${ps}</span>`;
  const r=p.pos==="RB"?g.opp.rushD:g.opp.passD;
  return`<span class="opp">${ps}<span class="vs">${g.home?"vs":"@"} ${tm(g.opp.id)}</span>${r?`<span class="dr${r<=8?" tough":""}" title="${ord(r)} ${p.pos==="RB"?"run":"pass"} defense">${ord(r)} D</span>`:""}</span>`;
}
function nameLine(p,id,st,extra){return`<span class="pn"><span class="nmx">${esc(shortName(p.name))}</span>${badgeFor(id,st)}${p.rookie?`<span class="rk">R</span>`:""}${extra||""}</span>`}
function badgeFor(id,st){

  return`<span class="inj${st==="out"||/out|ir|suspend/i.test(s)?" out":""}" title="${esc(s+(inj.details?", "+inj.details:""))}">${esc(/^ir/i.test(s)?"IR":s.slice(0,1).toUpperCase())}</span>`;

function pointsCol(l,side,id){
  const pl=P(id),pr=l.proj[id]||0,st=pst(l,side,id),s0=state(id,l);

  if(st.started){const live=!st.final;return{html:`<span class="pts" data-pk="${side}-${l.id}-${id}" data-pv="${st.actual}">${fmt(st.actual)}</span><span class="gs${live?" on":""}">${live?`<i class="livedot"></i>${clock(st.secs)||"Live"}`:"Final"}</span>`,v:st.actual,live}}

function row(l,id,on){

  if(on&&p.pos==="QB"){const m=l.roster.find(o=>o!==id&&lineups[l.id].has(o)&&P(o).pos==="QB"&&P(o).team===p.team);if(m)stk=`<span class="stk" title="${esc(P(m).name)} is also starting">Same team</span>`}

function render(){

  const{c,issues,dead,n}=check(l),set=lineups[l.id],tot=total(l),bestTot=[...best(l)].reduce((s,id)=>s+pts(l,id),0),gap=bestTot-tot;

  const faab=[...l.franchises].filter(f=>f.faab!=null).sort((a,b)=>b.faab-a.faab),fmax=Math.max(...faab.map(f=>f.faab),1);
  const lineupBody=`
    <div class="strip">${POS.map(p=>{const[a,b]=lim(l,p),off=c[p]<a||c[p]>b;return`<div class="cell ${p}${off?" off":""}"><span class="k"><i></i>${p}</span><b>${c[p]}<small>of ${a===b?a:a+"–"+b}</small></b></div>`}).join("")}</div>
    ${issues.length>1?`<p class="note">Also: ${esc(issues.slice(1).join(", ").toLowerCase())}.</p>`:""}

    ${colHead("Bench",bench.length,"Pts")}
    <div class="list">${bench.map(id=>row(l,id,false)).join("")}</div>`;
  const bar=confirming
    ?`<div class="ab"><div class="ab-text"><span class="ab-q">Send to MFL?</span><span class="ab-sub">Week ${week}, ${set.size} starters</span></div><div class="ab-btns"><button class="btn quiet" data-act="cancel"${busy?" disabled":""}>Cancel</button><button class="btn primary" data-act="send"${busy?" disabled":""}>${busy?"Sending…":"Send lineup"}</button></div></div>`
    :`<div class="ab"><div class="ab-text"><span class="ab-label">${sync?"Projected, matches MFL":"Projected, not sent yet"}</span><span class="ab-total">${fmt(tot)}</span><span class="ab-sub${issues.length?" bad":!sync?" warn":gap>0.005?" warn":""}">${esc(issues.length?issues[0]:!sync?"Differs from MFL. Send to update.":gap>0.005?`${fmt(gap)} pts left on bench`:"Your best lineup")}</span></div><div class="ab-btns">${gap>0.005?`<button class="btn quiet" data-act="best">Best lineup</button>`:""}<button class="btn primary" data-act="ask"${issues.length||sync?" disabled":""}>${sync?"Sent":"Send to MFL"}</button></div></div>`;

// ---- Matchup and live scoring ----
function pst(l,side,id){
  const p=l.live&&l.live[side]&&l.live[side].players[id],g=G[P(id).team];
  const kicked=g?Date.now()>=g.t*1000:false;
  const secs=p&&p.secs!=null?p.secs:null;
  const started=secs!=null?secs<3600:kicked;
  return{started,final:started&&(secs===0||(secs==null&&g&&Date.now()>g.t*1000+4*3600e3)),secs,actual:p&&p.score!=null?p.score:0};
}
function starters(l,side){
  const s=l.live&&l.live[side];if(!s)return{ids:[],set:false};
  const ids=Object.entries(s.players).filter(([,p])=>p.starter).map(([id])=>id);
  return{ids,set:ids.length>0};
}
function sideTotals(l,side,ids){
  let live=0,proj=0,started=0,left=0,playing=0;
  ids.forEach(id=>{
    const pl=P(id);if(pl.team==="FA"||D.byes.includes(pl.team))return;
    const st=pst(l,side,id),pr=l.proj[id]||0;
    if(st.started){live+=st.actual;started++;proj+=st.actual+(st.final?0:pr*Math.max(0,st.secs??0)/3600);if(!st.final){left++;playing++}}
    else{proj+=pr;left++}
  });
  return{live,proj,started,left,playing};
}
function synced(l){const m=starters(l,"me");if(!m.set)return false;const a=new Set(m.ids),b=lineups[l.id];return a.size===b.size&&[...b].every(x=>a.has(x))}
function matchupCard(l){
  const lv=l.live;
  const foot=`<div class="board-foot"><button class="ghost${liveBusy?" spin":""}" data-act="liveref">${ICON_REFRESH}Refresh scores</button><span>${D.liveAt?`Scores as of ${new Date(D.liveAt).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`:"Auto-updates during games"}</span></div>`;
  if(!lv||!lv.opp)return`<section class="board"><div class="board-top"><span class="board-label">Week ${week}</span></div>${alertLine(l)}<p class="board-note">${lv?"You don't have an opponent this week.":"MFL didn't send a matchup for this week. Refresh to try again."}</p>${foot}</section>`;
  const mine=starters(l,"me"),theirs=starters(l,"opp");
  const myIds=mine.set?mine.ids:[...lineups[l.id]];
  const a=sideTotals(l,"me",myIds),b=theirs.set?sideTotals(l,"opp",theirs.ids):null;
  const anyLive=a.started>0||(b&&b.started>0);
  const opp=l.franchises.find(f=>f.id===lv.opp.id)||{name:"Opponent"};
  const big=s=>s?(anyLive?s.live:s.proj):null;
  const A=big(a),B=big(b);
  const liveNow=a.playing>0||(b&&b.playing>0);
  const sub=s=>s?(anyLive?`Proj final ${fmt(s.proj)}`:"Projected"):"Lineup not set";
  const mySub=mine.set?(anyLive?sub(a):"Projected, as set on MFL"):"Not set on MFL yet";
  const sc=(v,k)=>`<span class="score"${intro&&v!=null?` data-count="${v}"`:anyLive&&v!=null?` data-pk="board-${l.id}-${k}" data-pv="${v}"`:""}>${v==null?"—":fmt(v)}</span>`;
  // Same win-chance estimate as the full matchup screen (uses their best guess lineup if they haven't set one).
  const oppIds=theirs.set?theirs.ids:bestOf(l,Object.keys(lv.opp.players));
  const pct=oppIds.length?winChance(l,myIds,oppIds):null;

      <div class="team r${B!=null&&B>A?" lead":""}"><span class="tid">${ficon(opp)}<span class="tname">${esc(opp.name)}</span></span>${sc(B,"opp")}<span class="tsub">${sub(b)}</span></div>
    </div>

// ---- Trade: calculator and finder (read-only; nothing is ever sent to MFL) ----

  const out=t.players.map(id=>{const pl=d.players[id]||{};return{k:"p"+id,kind:"p",name:pl.name||"Player "+id,pos:pl.pos||"?",v:vals[id]?vals[id][0]:0}});

// Totals with the stud tax: the side getting fewer pieces gets a premium for consolidating into the best player.

// Positional strength vs league average, and fair trade ideas with one opponent.
function posStrength(l,d){
  const vals=VALS[valKey(l)]||{},by={};
  d.teams.forEach(t=>{const p={QB:0,RB:0,WR:0,TE:0};t.players.forEach(id=>{const pos=(d.players[id]||{}).pos;if(p[pos]!=null)p[pos]+=vals[id]?vals[id][0]:0});by[t.id]=p});
  const avg={};POS.forEach(pos=>avg[pos]=d.teams.reduce((s,t)=>s+by[t.id][pos],0)/(d.teams.length||1));

function findTrades(l,d,opp){

  const order=r=>[...POS].sort((a,b)=>r[a]-r[b]),weak=r=>order(r).slice(0,2),surplus=r=>order(r).slice(-2);

  const mine=teamAssets(l,d,l.fid).filter(x=>x.kind==="p"&&x.v>=300),theirs=teamAssets(l,d,opp).filter(x=>x.kind==="p"&&x.v>=300);
  // They give from their surplus at one of my weak spots; I give from my surplus, preferring their weak spots.
  const get=theirs.filter(x=>myWeak.includes(x.pos)&&theirSur.includes(x.pos)).slice(0,8);
  let give=mine.filter(x=>mySur.includes(x.pos)&&theirWeak.includes(x.pos));
  if(!give.length)give=mine.filter(x=>mySur.includes(x.pos));
  give=give.slice(0,12);
  const out=[],add=(A,B)=>{const m=tradeMath(A,B);if(m.pct<=.10)out.push({a:A,b:B,m})};
  get.forEach(g=>{
    give.forEach(x=>add([x],[g]));
    for(let i=0;i<give.length;i++)for(let j=i+1;j<give.length;j++)add([give[i],give[j]],[g]);
  });
  // ...and 1-for-2 the other way: one of my surplus players for two of theirs that include a weak-spot fill.
  give.forEach(x=>{for(let i=0;i<get.length;i++)for(let j=0;j<theirs.length;j++){const y=theirs[j];if(y.k!==get[i].k)add([x],[get[i],y])}});

  if(!TR.opp||!opps.some(t=>t.id===TR.opp))TR.opp=opps[0]?.id||null;
  if(!TR.opp)return`<p class="note empty">No other teams in this league.</p>`;
  const A=teamAssets(l,d,l.fid),B=teamAssets(l,d,TR.opp),pickA=TR.a.map(k=>A.find(x=>x.k===k)).filter(Boolean),pickB=TR.b.map(k=>B.find(x=>x.k===k)).filter(Boolean);
  const m=tradeMath(pickA,pickB),k=n=>Math.round(n).toLocaleString("en-US");
  const side=(who,list,picked,q)=>{
    const sel=new Set(picked.map(x=>x.k));
    return`<section class="tside"><div class="tside-h"><span>${who==="a"?"You give":`${esc(fr(TR.opp).name)} gives`}</span><b>${k(who==="a"?m.sa:m.sb)}</b></div>
      <div class="tchips">${picked.length?picked.map(x=>`<button class="tchip" data-trx="${who}|${x.k}" aria-label="Remove ${esc(x.name)}"><span class="pos ${x.kind==="p"?esc(x.pos):""}">${x.kind==="p"?esc(x.pos):"PICK"}</span>${esc(x.kind==="p"?shortName(x.name):x.name)}<b>${x.v?k(x.v):"—"}${x.est?"*":""}</b><i aria-hidden="true">×</i></button>`).join(""):`<span class="note">Add players or picks below.</span>`}</div>
      <label class="search tsearch">${ICON_SEARCH}<input type="text" data-trq="${who}" placeholder="Search ${who==="a"?"your roster and picks":"their roster and picks"}" value="${esc(q)}" autocomplete="off"></label>
      <div class="tlist" id="trl-${who}">${tradeList(who,list,sel,q)}</div></section>`;
  };
  const ideas=findTrades(l,d,TR.opp);
  const share=m.ta+m.tb?m.ta/(m.ta+m.tb)*100:50,cls=m.pct<=.05?"fair":m.pct<=.15?"lean":"lop";
  const adj=m.adjA||m.adjB;
  return`<div class="tpick"><label>League<select data-trlg>${D.leagues.map(x=>`<option value="${x.id}"${x.id===l.id?" selected":""}>${esc(key(x))} · ${esc(me(x).name||"")}</option>`).join("")}</select></label>
      <label>Trade with<select data-tropp>${opps.map(t=>`<option value="${t.id}"${t.id===TR.opp?" selected":""}>${esc(fr(t.id).name)}</option>`).join("")}</select></label></div>
    ${side("a",A,pickA,TR.qa)}${side("b",B,pickB,TR.qb)}
    <div class="tbal ${pickA.length||pickB.length?cls:"idle"}" role="status">
      <div class="tbal-top"><span>You <b>${k(m.ta)}</b></span><strong>${pickA.length||pickB.length?esc(m.verdict):"Build a trade"}</strong><span><b>${k(m.tb)}</b> Them</span></div>
      <div class="tbar"><i style="width:${share}%"></i><span class="tmid"></span></div>
      <div class="tbal-foot"><div class="tbal-sub">${pickA.length||pickB.length?`${m.diff>=0?"You gain":"You give up"} ${k(Math.abs(m.diff))} (${(m.pct*100).toFixed(1)}%)`:"Within 5% is fair · 5–15% leans · over 15% lopsided"}${adj?` · <span class="tadj" tabindex="0" title="Value adjustment: in a ${Math.max(pickA.length,pickB.length)}-for-${Math.min(pickA.length,pickB.length)} deal, the side getting fewer pieces gets a ${STUD_TAX*100}% premium on its best player per extra piece (up to 2). One great player is worth more than the same value spread across several, because you only have so many starting spots.">+${k(adj)} stud tax ⓘ</span>`:""}</div>
      ${pickA.length||pickB.length?`<button class="btn sm quiet" data-act="trclear">Clear</button>`:""}</div></div>
    <div class="list-head"><span>Trade ideas<small>within 10%, fills a weak spot</small></span></div>
    ${ideas.length?`<div class="tideas">${ideas.map((t,i)=>`<div class="tidea"><div class="tid-sides"><div><small>You give</small>${t.a.map(x=>`<span><i class="pos ${esc(x.pos)}">${esc(x.pos)}</i>${esc(shortName(x.name))} <b>${k(x.v)}</b></span>`).join("")}</div><div><small>You get</small>${t.b.map(x=>`<span><i class="pos ${esc(x.pos)}">${esc(x.pos)}</i>${esc(shortName(x.name))} <b>${k(x.v)}</b></span>`).join("")}</div></div>
      <div class="tid-foot"><span>${k(t.m.ta)} vs ${k(t.m.tb)} · ${(t.m.pct*100).toFixed(1)}% apart${t.m.adjA||t.m.adjB?" (with stud tax)":""}</span><button class="btn sm quiet" data-trload="${i}">Load in calculator</button></div></div>`).join("")}</div>`:`<p class="note empty">No fair trades found with this team.</p>`}
    <p class="note">Values from FantasyCalc for this league's format. Nothing here is sent to MFL; propose trades on the MFL site.${[...A,...B].some(x=>x.est)?" * Estimated pick value by round.":""}</p>`;
}
function tradeList(who,list,sel,q){
  const s=q.trim().toLowerCase(),k=n=>n.toLocaleString("en-US");
  const items=list.filter(x=>!sel.has(x.k)&&(!s||x.name.toLowerCase().includes(s)||x.pos.toLowerCase()===s));
  if(!items.length)return`<p class="note">Nothing matches.</p>`;
  return items.slice(0,s?30:8).map(x=>`<button class="topt" data-tradd="${who}|${x.k}"><span class="pos ${x.kind==="p"?esc(x.pos):""}">${x.kind==="p"?esc(x.pos):"PICK"}</span><span class="tn">${esc(x.name)}</span><b>${x.v?k(x.v):"—"}${x.est?"*":""}</b><i aria-hidden="true">+</i></button>`).join("")+(!s&&items.length>8?`<p class="note">Search to see all ${items.length}.</p>`:"");
}
function renderFAList(){const l=D&&D.leagues.find(x=>x.id===cur),el=$("falist");if(l&&el)el.innerHTML=faList(l)}
document.addEventListener("input",e=>{if(e.target.id==="fasearch"){faQ=e.target.value;faShow=50;faSel=null;bidConfirm=false;renderFAList()}
  const w=e.target.dataset&&e.target.dataset.trq;
  if(w){TR["q"+w]=e.target.value;const l=D&&D.leagues.find(x=>x.id===cur),d=l&&RK[l.id],el=$("trl-"+w);
    if(l&&d&&d.teams&&el){const list=teamAssets(l,d,w==="a"?l.fid:TR.opp);el.innerHTML=tradeList(w,list,new Set(TR[w]),TR["q"+w])}}});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-tropp]")){TR.opp=e.target.value;TR.b=[];TR.qb="";render()}
  if(e.target.matches("[data-trlg]")){cur=e.target.value;store.set("dd-tab",cur);render()}});

// ---- Overview ----
function renderAll(){
  const shared=Object.entries(owned).filter(([,ks])=>ks.length>1).sort((a,b)=>b[1].length-a[1].length);
  const byeNames=D.byes.map(tm).join(", ");
  return`<section class="panel"><div class="panel-head"><h3>Week ${week} at a glance</h3><span>Tap a league to open it</span></div>
  <div class="glance">${D.leagues.map(l=>{
    const{issues,dead}=check(l),s=issues.length?["bad",issues[0]]:dead.length?["warn",`${dead.length} at 0`]:["ok","Ready"];
    const lv=l.live,opp=lv&&lv.opp?l.franchises.find(f=>f.id===lv.opp.id):null;
    return`<button class="grow" data-k="${l.id}"><span class="lg">${esc(key(l))}</span><span class="gn"><b>${esc(me(l).name||"")}</b><small>${opp?`vs ${esc(opp.name)}`:"No matchup"}</small></span><span class="gr"><span class="gt">${fmt(total(l))}</span><span class="status s-${s[0]}"><i></i>${esc(s[1])}</span></span></button>`}).join("")}</div>
  ${byeNames?`<p class="note">On bye this week: ${esc(byeNames)}.</p>`:""}</section>
  <section class="panel"><div class="panel-head"><h3>Shared players</h3><span>${shared.length} on two or more teams</span></div>
  <p class="note">An injury to one of these players hits more than one league.</p>
  <div class="list">${shared.map(([id,ks])=>{const p=P(id);return`<div class="row static">${shotOf(p,id)}<span class="nm">${nameLine(p,id,"")}${oppLine(id)}</span><span class="pv"><span class="gs">${ks.join(", ")}</span></span></div>`}).join("")}</div></section>`;
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2800)}

document.addEventListener("click",async e=>{
  const tab=e.target.closest("[data-k]");if(tab){muOpen=null;cur=tab.dataset.k;confirming=false;faSel=null;bidConfirm=false;claimUI=null;store.set("dd-tab",cur);render();if(tab.classList.contains("grow"))window.scrollTo({top:0,behavior:RM?"auto":"smooth"});return}
  if(!D)return;
  const l=D.leagues.find(x=>x.id===cur);if(!l)return;
  const cb=e.target.closest("[data-claim]");
  if(cb&&!busy){
    const f=FA[faKey(l)],claims=(f&&f.pending)||[],parsed=claims.map(parseClaim),k=cb.dataset.claim;
    if(k==="edit"||k==="cancel"){claimUI={kind:k,i:+cb.dataset.i};faSel=null;bidConfirm=false;render();return}
    if(k==="close"){claimUI=null;render();return}
    if(!claimUI||parsed.some(c=>!c))return;
    const c=parsed[claimUI.i];
    if(k==="docancel"){saveClaims(l,parsed.filter((_,i)=>i!==claimUI.i).map(pickOf),`Cancelled your claim on ${P(c.add).name}`);return}
    if(k==="dosave"){
      const amt=($("cbid")?.value||"").trim(),drop=$("cdrop")?.value||"",bal=me(l).faab,full=l.rosterSize&&l.roster.length>=l.rosterSize;
      if(!/^\d+$/.test(amt)){toast("Enter a whole-dollar bid, like 12");return}
      if(bal!=null&&+amt>bal){toast(`You only have $${bal} left`);return}
      if(full&&!drop){toast("Your roster is full. Pick someone to drop.");return}
      const next=parsed.map((x,i)=>i===claimUI.i?{add:x.add,bid:String(+amt),drop}:x);
      saveClaims(l,next.map(pickOf),`Updated your claim on ${P(c.add).name}`);return;
    }
    return;
  }
  if(e.target.closest('[data-act="mubench"]')){muBench=!muBench;renderMU();return}
  const mu=e.target.closest('[data-act="openmu"],[data-act="closemu"]');
  if(mu){if(mu.dataset.act==="openmu")openMU(l.id);else closeMU();return}
  if(e.target.closest('[data-act="streload"]')){delete ST[l.id];render();return}
  if(e.target.closest('[data-act="stmore"]')){stMore=!stMore;render();return}
  if(e.target.closest('[data-act="poreload"]')){delete PO[l.id];delete ODDS[l.id];try{localStorage.removeItem(`dd-po-${l.id}-${week}`)}catch(_){};render();return}
  const sv=e.target.closest("[data-stview]");if(sv){stView=sv.dataset.stview;render();return}
  const py=e.target.closest("[data-pkyear]");if(py){pkYear=+py.dataset.pkyear;render();return}
  if(e.target.closest('[data-act="rkreload"]')){delete RK[l.id];if(!VALS[valKey(l)]){valErr=false;loadValues()}render();return}
  const ta=e.target.closest("[data-tradd]"),tx=e.target.closest("[data-trx]");
  if(ta||tx){const[w,k]=(ta||tx).dataset[ta?"tradd":"trx"].split("|"),arr=TR[w];if(ta){if(!arr.includes(k))arr.push(k)}else TR[w]=arr.filter(x=>x!==k);render();return}
  if(e.target.closest('[data-act="trclear"]')){TR.a=[];TR.b=[];render();return}
  const tl=e.target.closest("[data-trload]");
  if(tl){const d=RK[l.id],t=d&&findTrades(l,d,TR.opp)[+tl.dataset.trload];if(t){TR.a=t.a.map(x=>x.k);TR.b=t.b.map(x=>x.k);render();document.querySelector(".tpick")?.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"})}return}
  const rs=e.target.closest("[data-rksort]");if(rs){rkSort=rs.dataset.rksort;render();return}
  const rr=e.target.closest("[data-rk]");if(rr){rkOpen=rkOpen===rr.dataset.rk?null:rr.dataset.rk;render();return}
  const md=e.target.closest("[data-mode]");
  if(md){if(mode!==md.dataset.mode){mode=md.dataset.mode;faSel=null;bidConfirm=false;claimUI=null;confirming=false;render()}return}
  const ch=e.target.closest("[data-pos]");
  if(ch){faPos=ch.dataset.pos;faShow=50;faSel=null;bidConfirm=false;render();return}
  const fr=e.target.closest("button[data-fa]");
  if(fr&&!busy){const id=fr.dataset.fa;faSel=faSel===id?null:id;bidDraft={amt:"",drop:""};bidConfirm=false;renderFAList();if(faSel){const inp=$("bidamt");if(inp)inp.focus({preventScroll:true})}return}
  const fa=e.target.closest("[data-act]");
  if(fa&&fa.dataset.act==="bhmore"){bhAll=!bhAll;render();return}
  if(fa&&fa.dataset.act==="bhtoggle"){bhOpen=!bhOpen;render();return}
  const fs=e.target.closest("[data-fasort]");if(fs){faSort=fs.dataset.fasort;faShow=50;renderFAList();return}
  if(fa&&["famore","fareload","bidask","bidcancel","bidsend"].includes(fa.dataset.act)){
    const k=faKey(l),f=FA[k];
    if(fa.dataset.act==="famore"){faShow+=50;renderFAList()}
    if(fa.dataset.act==="fareload"){delete FA[k];render()}
    if(fa.dataset.act==="bidask"){
      const amt=($("bidamt")?.value||"").trim(),drop=$("biddrop")?.value||"",bal=me(l).faab,full=l.rosterSize&&l.roster.length>=l.rosterSize;
      if(!/^\d+$/.test(amt)){toast("Enter a whole-dollar bid, like 12");return}
      if(bal!=null&&+amt>bal){toast(`You only have $${bal} left`);return}
      if(full&&!drop){toast("Your roster is full. Pick someone to drop.");return}
      bidDraft={amt,drop};bidConfirm=true;renderFAList();
    }
    if(fa.dataset.act==="bidcancel"){bidConfirm=false;renderFAList()}
    if(fa.dataset.act==="bidsend"){
      busy=true;renderFAList();
      try{const r=await api("POST",{action:"bid",league:l.id,host:l.host,add:faSel,bid:+bidDraft.amt,drop:bidDraft.drop||null});
        if(f)f.pending=r.pending;toast(`Bid placed: $${bidDraft.amt} on ${P(faSel).name}`);faSel=null}
      catch(err){if(err.message!=="PIN"&&err.message!=="PIN needed")toast(err.message)}
      busy=false;bidConfirm=false;render();
    }
    return;
  }
  const r=e.target.closest("button.row[data-id]");
  if(r&&!busy){const s=lineups[l.id],id=r.dataset.id,before=r.getBoundingClientRect();s.has(id)?s.delete(id):s.add(id);confirming=false;flashId=id;saveDraft(l);render();glide(id,before);return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="liveref"){refreshLive(false);return}
  if(act==="best"){lineups[l.id]=best(l);saveDraft(l);render();toast("Best projected lineup set")}
  if(act==="ask"){confirming=true;render()}
  if(act==="cancel"){confirming=false;render()}
  if(act==="send"){
    busy=true;render();
    try{await api("POST",{action:"lineup",league:l.id,host:l.host,week,starters:[...lineups[l.id]]});
      if(l.live&&l.live.me){const pl=l.live.me.players;Object.keys(pl).forEach(k=>pl[k].starter=lineups[l.id].has(k));lineups[l.id].forEach(k=>{if(!pl[k])pl[k]={score:null,secs:null,starter:true}});store.set("dd-data",D)}
      store.del(lk(l)); // MFL now has exactly this lineup, so there's no draft to keep
      toast(`Lineup sent to MFL for league ${key(l)}`)}
    catch(err){if(err.message!=="PIN"&&err.message!=="PIN needed")toast(err.message)}
    busy=false;confirming=false;render();
  }
});
$("pinform").addEventListener("submit",e=>{e.preventDefault();const v=$("pin").value.trim();if(!v)return;store.set("dd-pin",v);$("pin").value="";$("pinbox").hidden=true;load(week)});
$("retry").addEventListener("click",()=>load(week));
$("prev").addEventListener("click",()=>{if(week>1)load(week-1)});
$("next").addEventListener("click",()=>{if(week<18)load(week+1)});
if(D){try{prepare();render();loadValues()}catch(e){D=null}}
renderFoot();
load(null);
</script>
